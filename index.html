<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Game, Set & Match!</title>
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3F5EF" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game, Set & Match!">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400..900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   GAME, SET & MATCH! — design tokens
   Stile "Tabellone": fondo scuro, numeri luminosi, dati incolonnati,
   angoli arrotondati e bordi chiari. Menù Liquid Glass.
   Vittoria verde · Pareggio giallo · Sconfitta rossa
   Display: Bebas Neue · Testo: Work Sans
   ============================================================ */
:root{
  --optic:#D9F52B;
  --optic-deep:#B9D400;
  --clay:#C4593A;
  --clay-2:#E0785A;
  --hard:#1F5FA9;
  --hard-2:#3A87DA;
  --win:#2ED17A;
  --loss:#FF5C74;

  --radius:26px;
  --radius-s:16px;
  --safe-t:env(safe-area-inset-top, 0px);
  --safe-b:env(safe-area-inset-bottom, 0px);

  --f-sans:'Work Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --f-display:'Bebas Neue',var(--f-sans);
}
/* ---- SCURO (default) ---- */
:root, html[data-theme="dark"]{
  --bg:#000;
  --card-solid:#0A0C09;
  --card-brd:rgba(255,255,255,.14);
  --card-inner:rgba(217,245,43,.04);
  --txt:#EDF3E4;
  --txt-soft:rgba(237,243,228,.74);
  --txt-2:#96A08C;
  --txt-3:#6B7566;
  --field:rgba(255,255,255,.055);
  --field-brd:rgba(255,255,255,.14);
  --track:rgba(255,255,255,.08);
  --hm-empty:rgba(255,255,255,.06);
  --num:#D9F52B;
  --draw:#F5C93A;
  --glow-num:0 0 14px rgba(217,245,43,.5);
  --ring-glow:drop-shadow(0 0 6px rgba(217,245,43,.45));
  --stencil:rgba(217,245,43,.45);
  --glow:0 18px 44px -20px rgba(0,0,0,.95);
  --court:radial-gradient(120% 80% at 50% -10%, rgba(30,154,107,.16), transparent 62%),
          radial-gradient(90% 60% at 100% 0%, rgba(31,95,169,.12), transparent 60%);
  --scan:repeating-linear-gradient(rgba(255,255,255,.045) 0 1px, transparent 1px 3px);
  --scan-o:1;
  --glass-bg:rgba(255,255,255,.08);
  --glass-brd:rgba(255,255,255,.22);
  --glass-sheen:rgba(255,255,255,.16);
  --tab-off:rgba(255,255,255,.45);
  --tab-on-bg:rgba(255,255,255,.14);
  --tab-on:var(--optic);
}
/* ---- CHIARO ---- */
html[data-theme="light"]{
  --bg:#F3F5EF;
  --card-solid:#FFFFFF;
  --card-brd:rgba(16,28,14,.12);
  --card-inner:transparent;
  --txt:#101710;
  --txt-soft:rgba(16,23,16,.68);
  --txt-2:#586052;
  --txt-3:#8B948A;
  --field:rgba(16,28,14,.045);
  --field-brd:rgba(16,28,14,.13);
  --track:rgba(16,28,14,.09);
  --hm-empty:rgba(16,28,14,.07);
  --num:#67840A;
  --draw:#8A6A00;
  --glow-num:none;
  --ring-glow:none;
  --stencil:rgba(103,132,10,.5);
  --glow:0 16px 36px -22px rgba(12,40,28,.5);
  --court:radial-gradient(120% 80% at 50% -10%, rgba(30,154,107,.14), transparent 62%);
  --scan:none;
  --scan-o:0;
  --glass-bg:rgba(255,255,255,.6);
  --glass-brd:rgba(16,28,14,.14);
  --glass-sheen:rgba(255,255,255,.7);
  --tab-off:rgba(16,28,14,.42);
  --tab-on-bg:rgba(16,28,14,.07);
  --tab-on:#55710A;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font-family:var(--f-sans);
  font-size:16px;line-height:1.35;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
body::before{content:"";position:fixed;inset:0;background:var(--court);pointer-events:none;z-index:0}
body::after{content:"";position:fixed;inset:0;background:var(--scan);opacity:var(--scan-o);pointer-events:none;z-index:0}
input,select,textarea,button{font-family:inherit;font-size:16px;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column}
main{
  flex:1;padding:0 18px calc(var(--safe-b) + 120px);
  max-width:520px;width:100%;margin:0 auto;
}

/* ---------- header (stencil, centrato) ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  padding:calc(var(--safe-t) + 30px) 62px 14px;
  max-width:520px;margin:0 auto;width:100%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(to bottom,var(--bg) 70%,transparent);
}
.stencil{position:relative;display:inline-block;max-width:100%}
.stencil h1{
  margin:0;position:relative;z-index:2;
  font-family:var(--f-display);font-weight:400;font-size:29px;line-height:.95;letter-spacing:.025em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.stencil .ghost{
  position:absolute;left:0;right:0;top:-11px;z-index:1;pointer-events:none;
  font-family:var(--f-display);font-weight:400;font-size:29px;line-height:.95;letter-spacing:.025em;
  white-space:nowrap;overflow:hidden;
  color:transparent;-webkit-text-stroke:1px var(--stencil);
}
.stencil.sm h1,.stencil.sm .ghost{font-size:23px}
.stencil.sm .ghost{top:-9px}
.iconbtn{
  position:absolute;left:18px;top:50%;transform:translateY(-50%);
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:var(--field);border:1px solid var(--field-brd);
}
.iconbtn:active{transform:translateY(-50%) scale(.92)}
.iconbtn svg{width:18px;height:18px;stroke:var(--txt);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- toast ---------- */
#pill{
  position:fixed;left:50%;transform:translate(-50%,-140%);
  top:calc(var(--safe-t) + 2px);z-index:200;
  display:flex;align-items:center;gap:9px;
  padding:9px 15px;border-radius:100px;
  background:#0B100D;color:#F2F6F1;border:1px solid rgba(255,255,255,.16);
  box-shadow:0 12px 30px -8px rgba(0,0,0,.8);
  font-size:13px;font-weight:700;
  transition:transform .42s cubic-bezier(.2,1.1,.3,1),opacity .3s;
  opacity:0;max-width:calc(100vw - 32px);
}
#pill.on{transform:translate(-50%,0);opacity:1}
#pill .dot{width:8px;height:8px;border-radius:50%;background:var(--optic);flex:none}
#pill .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- menù Liquid Glass ---------- */
nav.tabs{
  position:fixed;left:14px;right:14px;bottom:calc(var(--safe-b) + 18px);z-index:60;
  max-width:452px;margin:0 auto;
  display:flex;gap:10px;align-items:stretch;
}
.tabbar{
  position:relative;display:flex;padding:0;
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(38px) saturate(220%);backdrop-filter:blur(38px) saturate(220%);
  border:.5px solid var(--glass-brd);border-radius:32px;
  box-shadow:var(--glow),inset 0 1px 0 var(--glass-sheen),inset 0 -1px 0 rgba(0,0,0,.2);
  overflow:hidden;
}
.tabbar::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,var(--glass-sheen) 0%,rgba(255,255,255,.03) 22%,rgba(255,255,255,0) 45%);
}
.pill-main{flex:1}
.pill-side{flex:0 0 auto}
.tabbtn{
  position:relative;z-index:1;flex:1;
  display:flex;align-items:center;justify-content:center;
  color:var(--tab-off);padding:18px 0;border-radius:28px;transition:color .2s;
}
.pill-side .tabbtn{flex:0 0 auto;padding:18px 21px}
.tabbtn.on{color:var(--tab-on)}
.tabbtn.on::before{
  content:'';position:absolute;inset:0;z-index:-1;border-radius:32px;
  background:var(--tab-on-bg);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 2px rgba(0,0,0,.15);
}
.tabbtn svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbtn:active{transform:scale(.94)}
.tab-plus{color:var(--tab-on)}
.tab-plus svg{stroke-width:2.4}

/* ---------- card ---------- */
.card{
  background:var(--card-solid);
  border:1px solid var(--card-brd);
  border-radius:var(--radius);
  padding:18px 16px;
  text-align:center;
  box-shadow:var(--glow),inset 0 0 40px var(--card-inner);
}
.card + .card{margin-top:13px}
.clabel{
  font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--txt-3);margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--card-brd);
}
.clabel em{font-style:normal;color:var(--txt-2);opacity:.75}
.clabel b{font-family:var(--f-display);font-weight:400;font-size:19px;letter-spacing:.04em;color:var(--num);text-shadow:var(--glow-num);vertical-align:-1px}
.sec{margin:24px 0 11px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.sec h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.05em;text-transform:uppercase}
.sec .hint{font-size:10px;color:var(--txt-3);font-weight:800;text-transform:uppercase;letter-spacing:.12em;background:none}

/* profilo / hero */
.avatar{
  width:78px;height:78px;border-radius:22px;flex:none;object-fit:cover;
  background:var(--field);border:1px solid var(--card-brd);
  display:grid;place-items:center;
  font-family:var(--f-display);font-size:32px;font-weight:400;
  color:var(--num);text-shadow:var(--glow-num);
}
.herotop{display:flex;align-items:center;justify-content:center;gap:16px}
.heroname{text-align:left;min-width:0}
.heroname .n1{font-family:var(--f-display);font-weight:400;font-size:25px;letter-spacing:.02em;line-height:1.02;color:var(--txt-2)}
.heroname .n2{font-family:var(--f-display);font-weight:400;font-size:31px;letter-spacing:.02em;line-height:1.02}
.heroname .flag{font-family:var(--f-sans);font-size:19px;vertical-align:2px;margin-left:7px;text-shadow:none}
.hero .meta{font-size:10.5px;color:var(--txt-2);font-weight:800;text-transform:uppercase;letter-spacing:.08em;line-height:1.7;margin-top:13px}
.hero .meta .lvl{color:var(--num);text-shadow:var(--glow-num)}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;padding-top:13px;border-top:1px solid var(--card-brd)}
.kpi{padding:0 4px}
.kpi + .kpi{border-left:1px solid var(--card-brd)}
.kpi b{
  display:block;font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.02em;
  color:var(--num);text-shadow:var(--glow-num);
}
.kpi span{font-size:9px;color:var(--txt-3);font-weight:800;text-transform:uppercase;letter-spacing:.1em;display:block;margin-top:3px}

/* segmented */
.seg{display:flex;gap:4px;padding:4px;background:var(--field);border-radius:100px;border:1px solid var(--field-brd)}
.seg button{flex:1;padding:9px 6px;border-radius:100px;font-size:12px;font-weight:800;color:var(--txt-2);transition:.18s;text-transform:uppercase;letter-spacing:.06em;min-width:0}
.seg button.on{background:var(--txt);color:var(--bg)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none;justify-content:center}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:8px 14px;border-radius:100px;font-size:12px;font-weight:800;
  background:var(--field);border:1px solid var(--field-brd);color:var(--txt-2);white-space:nowrap;
  text-transform:uppercase;letter-spacing:.05em;
}
.chip.on{background:var(--optic);border-color:var(--optic);color:#0F1508}
.chip.on.w{background:var(--win);border-color:var(--win);color:#04170D}
.chip.on.l{background:var(--loss);border-color:var(--loss);color:#2A0409}
.chip.on.d{background:#F5C93A;border-color:#F5C93A;color:#2A1F00}
.chip.on.clay{background:var(--clay);border-color:var(--clay);color:#2A0904}
.chip.on.hard{background:var(--hard);border-color:var(--hard);color:#04101F}

/* ricerca + h2h */
.searchrow{display:flex;gap:9px;margin-bottom:14px}
.searchrow #q{flex:1 1 auto;min-width:0;width:auto}
.searchrow .h2hsel{
  flex:0 0 auto;width:76px;padding:13px 8px;font-size:12px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:var(--num);text-align:center;text-align-last:center;
  background-image:none;padding-right:8px;
}

/* filtri storico */
.frow{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.flab{flex:none;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--txt-3);width:70px;text-align:left;line-height:1.2}
.fchips{flex:1;display:flex;gap:6px;min-width:0}
.fchips .chip{flex:1 1 0;min-width:0;padding:9px 4px;text-align:center;font-size:10px;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis}

/* badge superficie */
.sdot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}
.sbadge{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;
  font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#fff;
}
.sbadge i{width:6px;height:6px;border-radius:2px;background:rgba(255,255,255,.85);display:block}
.s-clay{background:linear-gradient(135deg,var(--clay),var(--clay-2))}
.s-hard{background:linear-gradient(135deg,var(--hard),var(--hard-2))}

/* card partita (riga + note) */
.mcard{
  background:var(--card-solid);border:1px solid var(--card-brd);border-radius:18px;
  margin-bottom:9px;position:relative;overflow:hidden;
  box-shadow:inset 0 0 30px var(--card-inner);
}
.mcard:active{transform:scale(.985)}
.mcard .bar{position:absolute;left:0;top:0;bottom:0;width:3px;z-index:1}
.b-clay{background:linear-gradient(var(--clay-2),var(--clay))}
.b-hard{background:linear-gradient(var(--hard-2),var(--hard))}
.mrow{display:flex;align-items:center;gap:11px;padding:13px 14px;text-align:left}
.mrow .res{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;margin-left:3px;
  font-family:var(--f-display);font-size:16px;font-weight:400;
}
.res.w,.fres.w,.fdot.w{background:rgba(46,209,122,.13);color:var(--win);border:1px solid rgba(46,209,122,.4)}
.res.l,.fres.l,.fdot.l{background:rgba(255,92,116,.11);color:var(--loss);border:1px solid rgba(255,92,116,.38)}
.res.d,.fres.d,.fdot.d{background:rgba(245,201,58,.14);color:var(--draw);border:1px solid rgba(245,201,58,.4)}
.mrow .mid{flex:1;min-width:0}
.mrow .opp{font-size:13.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.mrow .sub{font-size:10px;color:var(--txt-soft);font-weight:700;margin-top:2px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mnote{
  padding:9px 14px 11px 20px;border-top:1px solid var(--card-brd);text-align:left;
  font-size:11.5px;line-height:1.45;color:var(--txt-soft);
}
.mnote b{
  font-weight:800;color:var(--txt-3);text-transform:uppercase;letter-spacing:.1em;
  font-size:9.5px;margin-right:7px;
}
.score{display:flex;gap:7px;align-items:center;font-weight:800;font-size:14px;flex:none}
.score .st{position:relative;color:var(--win)}
.score .st.l{color:var(--loss)}
.score .st.d{color:var(--draw)}
.score .tb{position:absolute;top:-6px;right:-8px;font-size:9px;color:var(--txt-3);font-weight:700}

/* forma recente */
.fgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:4px}
.fres{
  width:100%;aspect-ratio:1;border-radius:7px;display:grid;place-items:center;
  font-family:var(--f-display);font-weight:400;font-size:14px;line-height:1;
}
.fres:active{transform:scale(.9)}
.reveal{
  border-radius:14px;padding:12px 14px;margin-bottom:13px;border:1px solid transparent;
  font-size:13px;font-weight:800;letter-spacing:.03em;line-height:1.45;
}
.reveal .rtit{font-family:var(--f-display);font-weight:400;font-size:19px;letter-spacing:.05em;display:block;margin-bottom:2px}
.reveal.w{background:rgba(46,209,122,.12);color:var(--win);border-color:rgba(46,209,122,.32)}
.reveal.l{background:rgba(255,92,116,.1);color:var(--loss);border-color:rgba(255,92,116,.3)}
.reveal.d{background:rgba(245,201,58,.12);color:var(--draw);border-color:rgba(245,201,58,.34)}

/* grafici */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;align-items:start}
.ring{position:relative;width:100%;max-width:104px;margin:0 auto}
.ring svg{display:block;width:100%;height:auto}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid b{
  display:block;font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:.02em;
  color:var(--num);text-shadow:var(--glow-num);
}
.ringlab{margin-top:8px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--txt-3)}
.ringsub{font-size:10.5px;font-weight:700;color:var(--txt-2);margin-top:2px;font-variant-numeric:tabular-nums}
.ringarc{filter:var(--ring-glow)}

.glegend{display:flex;justify-content:center;gap:18px;margin-top:12px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--txt-3)}
.glegend i{width:14px;height:3px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:3px}

.bars{display:flex;flex-direction:column;gap:14px;text-align:left}
.bline .t{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:800;margin-bottom:7px;text-transform:uppercase;letter-spacing:.05em;gap:8px}
.bline .t span{color:var(--txt-3);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.03em;white-space:nowrap}
.track{height:8px;border-radius:100px;background:var(--track);overflow:hidden}
.fill{height:100%;border-radius:100px;transition:width .6s cubic-bezier(.2,.9,.3,1)}

/* superfici: barra unica sfumata */
.blend .r2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.blend .r2 small{display:block;font-size:10px;color:var(--txt-3);font-weight:700;letter-spacing:.03em;margin-top:2px;text-transform:none}
.blend .r2 .b{text-align:right}

.formrow{display:flex;gap:5px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.fdot{width:23px;height:23px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-display);font-size:13px}

.hmlegend{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px;font-size:9.5px;color:var(--txt-3);font-weight:700;text-transform:uppercase;letter-spacing:.06em;flex-wrap:wrap}
.hmlegend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* form */
label.fl{display:block;font-size:10px;font-weight:800;color:var(--txt-3);text-transform:uppercase;letter-spacing:.12em;margin:0 0 8px 3px;text-align:left}
.field{
  width:100%;max-width:100%;min-width:0;padding:13px 14px;border-radius:15px;background:var(--field);
  border:1px solid var(--field-brd);color:var(--txt);outline:none;transition:.18s;
  appearance:none;-webkit-appearance:none;
}
input.field[type="date"]{padding:12px 12px;font-variant-numeric:tabular-nums}
select.field{
  padding-right:34px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);

<script>
/* =========================================================
   STATO
   ========================================================= */
const KEY='myTennis.v1';
const SURF={
  clay  :{n:'Terra',   cls:'clay',  c:'--clay-2',  pk:'c'},
  hard  :{n:'Cemento', cls:'hard',  c:'--hard-2',  pk:'h'}
};
const SKEYS=Object.keys(SURF);
const MESI=['GEN','FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC'];
const ORARI=(()=>{const a=[];for(let h=0;h<24;h++){a.push(String(h).padStart(2,'0')+':00');a.push(String(h).padStart(2,'0')+':30');}return a;})();
const DURATE=[60,90,120,150,180,210,240];
const NAZ=[['IT','Italia'],['AL','Albania'],['AR','Argentina'],['AT','Austria'],['BE','Belgio'],['BR','Brasile'],
  ['HR','Croazia'],['FR','Francia'],['DE','Germania'],['GR','Grecia'],['MA','Marocco'],['NL','Paesi Bassi'],
  ['PL','Polonia'],['PT','Portogallo'],['GB','Regno Unito'],['RO','Romania'],['RU','Russia'],['RS','Serbia'],
  ['ES','Spagna'],['US','Stati Uniti'],['SE','Svezia'],['CH','Svizzera'],['TN','Tunisia'],['UA','Ucraina']];

const blankProfile=()=>({name:'',surname:'',hand:'Destro',level:'',avatar:'',age:'',nat:'IT',city:'',height:''});
const blank=()=>({profile:blankProfile(),matches:[],theme:''});
let S=load();
let view={n:'home'};
let draft=null;
let filt={surf:new Set(SKEYS), res:new Set(['W','D','L']), q:''};
let hmYear=new Date().getFullYear();
let gid=0;

function load(){
  try{
    const r=JSON.parse(localStorage.getItem(KEY));
    if(r&&r.matches){
      const o=Object.assign(blank(),r);
      o.profile=Object.assign(blankProfile(),r.profile||{});
      // vecchio campo unico "name" → nome + cognome
      if(!o.profile.surname&&o.profile.name&&o.profile.name.trim().includes(' ')){
        const p=o.profile.name.trim().split(/\s+/);
        o.profile.name=p.shift();
        o.profile.surname=p.join(' ');
      }
      return o;
    }
  }catch(e){}
  return blank();
}
function save(){localStorage.setItem(KEY,JSON.stringify(S));cloudPush();}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* =========================================================
   CLOUD SYNC (Firebase Auth + Realtime Database)
   ========================================================= */
let cloudUser=null, cloudTimer=null, cloudBusy=false;
function initCloud(){
  const fb=window.firebase;
  fb.onAuthStateChanged(fb.auth, user=>{
    cloudUser=user;
    if(user) cloudPull();
    render();
  });
}
function cloudLogin(){
  const fb=window.firebase;
  if(!fb){flash('Servizio non disponibile, riprova tra poco');return;}
  fb.signInWithPopup(fb.auth, new fb.GoogleAuthProvider()).catch(err=>{
    console.error('[gsm] login error',err);
    if(err&&(err.code==='auth/popup-blocked'||err.code==='auth/cancelled-popup-request'||err.code==='auth/operation-not-supported-in-this-environment')){
      fb.signInWithRedirect(fb.auth, new fb.GoogleAuthProvider());
    }else if(err&&err.code!=='auth/popup-closed-by-user'){
      flash('Accesso non riuscito ('+(err&&err.code||'errore')+')');
    }
  });
}
function cloudLogout(){
  const fb=window.firebase;
  fb.signOut(fb.auth);
  cloudUser=null;render();
}
function cloudPush(){
  if(!cloudUser||!window.firebase)return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(()=>{
    const fb=window.firebase;
    fb.set(fb.ref(fb.db,'users/'+cloudUser.uid),
      {profile:S.profile, matches:S.matches, theme:S.theme, updatedAt:Date.now()}).catch(()=>{});
  },800);
}
async function cloudPull(){
  if(!cloudUser||cloudBusy)return;
  cloudBusy=true;
  try{
    const fb=window.firebase;
    const snap=await fb.get(fb.ref(fb.db,'users/'+cloudUser.uid));
    if(snap.exists())mergeFromCloud(snap.val());
    else cloudPush();
  }catch(e){}
  cloudBusy=false;
}
function mergeFromCloud(remote){
  const map={};
  (S.matches||[]).forEach(m=>map[m.id]=m);
  (remote.matches||[]).forEach(m=>map[m.id]=m);
  S.matches=Object.values(map);
  if(remote.profile)S.profile=Object.assign(S.profile,remote.profile);
  if(remote.theme)S.theme=remote.theme;
  localStorage.setItem(KEY,JSON.stringify(S));
  applyTheme();render();
}
window.addEventListener('gsm-fb-ready', initCloud);
function haptic(){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}

/* tema */
function applyTheme(){
  const t=S.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
  document.documentElement.dataset.theme=t;
}
applyTheme();

/* =========================================================
   HELPERS PARTITE
   ========================================================= */
function setsWon(m){
  let a=0,b=0;
  (m.sets||[]).forEach(s=>{ if(s.me>s.opp)a++; else if(s.opp>s.me)b++; });
  return [a,b];
}
/* l'esito scelto a mano vince; per le partite vecchie si calcola dai set */
function outcome(m){
  if(m&&(m.result==='W'||m.result==='D'||m.result==='L'))return m.result;
  if(!m||!m.sets||!m.sets.length)return null;
  const [a,b]=setsWon(m);
  if(a===b)return 'D';
  return a>b?'W':'L';
}
function resClass(o){return o==='W'?'w':o==='L'?'l':o==='D'?'d':'';}
function resLetter(o){return o==='W'?'V':o==='L'?'X':o==='D'?'P':'–';}
function resName(o){return o==='W'?'Vittoria':o==='L'?'Sconfitta':o==='D'?'Pareggio':'—';}
function flipScore(t){
  if(!t)return t;
  const p=String(t).split('-');
  return p.length===2?p[1].trim()+'-'+p[0].trim():t;
}
/* i set si mostrano sempre col vincitore per primo:
   partita persa → girati; partita vinta o pareggiata → come sono stati inseriti */
function dispSets(m){
  const flip=outcome(m)==='L';
  return (m.sets||[]).map(s=>{
    const mine=+s.me||0, theirs=+s.opp||0;
    return {
      a: flip?theirs:mine,
      b: flip?mine:theirs,
      tb: flip?flipScore(s.tb):s.tb,
      cls: mine>theirs?'w':theirs>mine?'l':'d'   // colore dal mio punto di vista
    };
  });
}
function scoreStr(m){return dispSets(m).map(s=>s.a+'-'+s.b).join(' ')||'–';}
/* toglie le iniziali puntate: "Marusich M." → "Marusich", "M. Rossi" → "Rossi" */
function surnameOf(full){
  const t=String(full||'').trim();
  if(!t)return '';
  const parts=t.split(/\s+/).filter(p=>!/^[A-Za-zÀ-ÿ]\.?$/.test(p));
  return parts.length?parts.join(' '):t;
}
function myName(){
  const p=S.profile;
  return [p.name,p.surname].filter(Boolean).join(' ').trim();
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function sorted(){return S.matches.slice().sort((x,y)=>(y.date+ (y.time||'')).localeCompare(x.date+(x.time||'')));}

function record(list){
  let w=0,l=0,d=0;
  list.forEach(m=>{const o=outcome(m);if(o==='W')w++;else if(o==='L')l++;else if(o==='D')d++;});
  const tot=w+l+d;
  return {w,l,d,tot,pct:tot?Math.round(w/tot*100):0};
}
/* record scritto in ordine vittorie-pareggi-sconfitte */
function recStr(r){return r.d?`${r.w}-${r.d}-${r.l}`:`${r.w}-${r.l}`;}
function gamesRec(list){
  let g=0,o=0;list.forEach(m=>(m.sets||[]).forEach(s=>{g+=+s.me||0;o+=+s.opp||0}));return{g,o};
}
function setsRec(list){
  let a=0,b=0;list.forEach(m=>{const[x,y]=setsWon(m);a+=x;b+=y;});return{a,b};
}
function dateLabel(iso,time){
  const d=new Date(iso+'T00:00:00');
  const s=d.toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'});
  return time?s+' · '+time:s;
}
function relDay(iso){
  const d=new Date(iso+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);
  const diff=Math.round((n-d)/86400000);
  if(diff===0)return'Oggi';if(diff===1)return'Ieri';
  if(diff<7&&diff>0)return diff+' giorni fa';
  return d.toLocaleDateString('it-IT',{day:'2-digit',month:'short'});
}
function monthLabel(iso){
  const d=new Date(iso+'T00:00:00');
  return cap(d.toLocaleDateString('it-IT',{month:'long',year:'numeric'}));
}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
function durLabel(min){
  const h=Math.floor(min/60),m=min%60;
  return h+(h===1?' ora':' ore')+(m?' e '+m:'');
}
function flagEmoji(cc){
  cc=(cc||'').trim().toUpperCase();
  if(!/^[A-Z]{2}$/.test(cc))return '';
  return String.fromCodePoint(...[...cc].map(c=>0x1F1E6+c.charCodeAt(0)-65));
}
function uniqueField(f){
  const seen=new Map();
  S.matches.forEach(m=>{
    const v=(m[f]||'').trim();if(!v)return;
    const k=v.toLowerCase();
    if(!seen.has(k))seen.set(k,{v,n:0});
    seen.get(k).n++;
  });
  return [...seen.values()].sort((a,b)=>b.n-a.n||a.v.localeCompare(b.v)).map(x=>x.v);
}

/* =========================================================
   GRAFICI SVG
   ========================================================= */
function ring(pct,label,sub){
  const id='rg'+(++gid);
  const r=42,c=2*Math.PI*r,off=c*(1-pct/100);
  const ang=-90+(pct/100)*360;
  return `<div>
    <div class="ring">
      <svg viewBox="0 0 104 104">
        <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="var(--num)"/><stop offset="1" stop-color="var(--win)"/>
        </linearGradient></defs>
        <circle cx="52" cy="52" r="${r}" fill="none" stroke="var(--track)" stroke-width="9"/>
        <circle class="ringarc" cx="52" cy="52" r="${r}" fill="none" stroke="url(#${id})" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 52 52)">
          <animate attributeName="stroke-dashoffset" from="${c.toFixed(1)}" to="${off.toFixed(1)}" dur=".85s" fill="freeze"
            calcMode="spline" keySplines=".2 .9 .3 1" keyTimes="0;1"/>
        </circle>
      </svg>
      <div class="mid"><b>${pct}%</b></div>
    </div>
    <div class="ringlab">${label}</div>
    <div class="ringsub">${sub}</div>
  </div>`;
}
/* linea game fatti (verde) contro game subiti (rosso) */
function gamesChart(list){
  const seq=list.slice().reverse();
  if(seq.length<2)return '<div style="color:var(--txt-3);font-size:12px">Servono almeno due partite.</div>';
  const mine=[],theirs=[];
  seq.forEach(m=>{
    let g=0,o=0;(m.sets||[]).forEach(s=>{g+=+s.me||0;o+=+s.opp||0});
    mine.push(g);theirs.push(o);
  });
  const max=Math.max(1,...mine,...theirs);
  const W=280,H=118,P=8;
  const X=i=>P+i/(seq.length-1)*(W-P*2);
  const Y=v=>H-P-(v/max)*(H-P*2);
  const path=a=>a.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const dots=(a,col)=>a.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.4" fill="${col}"/>`).join('');
  let grid='';
  for(let k=1;k<=3;k++){
    const y=P+(H-P*2)*k/4;
    grid+=`<line x1="0" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}" stroke="var(--card-brd)" stroke-width="1" stroke-dasharray="3 5"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible">
    ${grid}
    <path d="${path(theirs)}" fill="none" stroke="var(--loss)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${path(mine)}" fill="none" stroke="var(--win)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots(theirs,'var(--loss)')}${dots(mine,'var(--win)')}
  </svg>
  <div class="glegend">
    <span><i style="background:var(--win)"></i>Game fatti</span>
    <span><i style="background:var(--loss)"></i>Game subiti</span>
  </div>`;
}
/* calendario dell'anno: un quadratino per giorno */
function heatmap(year){
  const day={};
  S.matches.forEach(m=>{
    if(!m.date||m.date.slice(0,4)!==String(year))return;
    const o=outcome(m);if(!o)return;
    const d=(day[m.date]=day[m.date]||{w:0,l:0,d:0});
    if(o==='W')d.w++;else if(o==='L')d.l++;else d.d++;
  });
  const jan=new Date(year,0,1);
  const start=new Date(jan);
  start.setDate(start.getDate()-((jan.getDay()+6)%7));
  const CELL=9,GAP=2.6,STEP=CELL+GAP,COLS=53;
  const W=COLS*STEP,H=14+7*STEP;
  let cells='',labels='',lastMon=-1;
  for(let c=0;c<COLS;c++){
    for(let r=0;r<7;r++){
      const dt=new Date(start);dt.setDate(dt.getDate()+c*7+r);
      if(dt.getFullYear()!==year)continue;
      const iso=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
      const rec=day[iso];
      let f='var(--hm-empty)';
      if(rec)f = rec.w>rec.l ? 'var(--win)' : rec.l>rec.w ? 'var(--loss)' : 'var(--draw)';
      cells+=`<rect x="${(c*STEP).toFixed(1)}" y="${(14+r*STEP).toFixed(1)}" width="${CELL}" height="${CELL}" rx="2.4" fill="${f}"/>`;
      if(r===0&&dt.getMonth()!==lastMon){
        lastMon=dt.getMonth();
        labels+=`<text x="${(c*STEP).toFixed(1)}" y="8" fill="var(--txt-3)" font-size="7.5" font-weight="700" letter-spacing=".4">${MESI[dt.getMonth()]}</text>`;
      }
    }
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${labels}${cells}</svg>`;
}
function ball(){
  return `<svg class="ball" viewBox="0 0 64 64" fill="none">
    <defs><radialGradient id="gb" cx="35%" cy="30%" r="75%">

}

/* barra unica: più giochi su una superficie, più il colore tende a quella */
function surfaceBlend(all,label){
  const rc=record(all.filter(m=>m.surface==='clay'));
  const rh=record(all.filter(m=>m.surface==='hard'));
  const tot=rc.tot+rh.tot;
  if(!tot)return '';
  const p=Math.round(rc.tot/tot*100);
  const a=Math.max(0,p-16), b=Math.min(100,p+16);
  return `<section class="card">
    <div class="clabel">${label||'Superfici <em>· all-time</em>'}</div>
    <div class="blend">
      <div class="r2" style="margin-bottom:9px">
        <div style="color:var(--clay-2)">Terra<small>${rc.tot} partite · ${rc.pct}%</small></div>
        <div class="b" style="color:var(--hard-2)">Cemento<small>${rh.tot} partite · ${rh.pct}%</small></div>
      </div>
      <div class="track" style="height:12px">
        <div class="fill" style="width:100%;background:linear-gradient(90deg,var(--clay) 0%,var(--clay-2) ${a}%,var(--hard-2) ${b}%,var(--hard) 100%)"></div>
      </div>
      <div class="r2" style="margin-top:9px">
        <div><small>${rc.w}V · ${rc.d}P · ${rc.l}S</small></div>
        <div class="b"><small>${rh.w}V · ${rh.d}P · ${rh.l}S</small></div>
      </div>
    </div>
  </section>`;
}

function mrow(m){
  const o=outcome(m),s=SURF[m.surface]||SURF.hard;
  const sc=dispSets(m).map(x=>
    `<div class="st ${x.cls}">${x.a}-${x.b}${x.tb?`<span class="tb">${esc(String(x.tb).split('-')[0]||'')}</span>`:''}</div>`).join('');
  return `<div class="mcard" data-act="detail" data-id="${m.id}">
    <div class="bar b-${s.cls}"></div>
    <div class="mrow">
      <div class="res ${resClass(o)}">${resLetter(o)}</div>
      <div class="mid">
        <div class="opp">${esc(m.opponent||'Avversario')}</div>
        <div class="sub">${relDay(m.date)} · ${s.n}${m.court?' · '+esc(m.court):''}</div>

      <div class="score num">${sc}</div>
    </div>
    <div class="mnote"><b>Note :</b>${m.notes?esc(m.notes):''}</div>

}

/* --- record personali --- */
function bestStreak(type){
  const chrono=sorted().slice().reverse();
  let best=0,bestFrom=null,bestTo=null,cur=0,curFrom=null;
  chrono.forEach(m=>{
    if(outcome(m)===type){
      if(cur===0)curFrom=m;
      cur++;
      if(cur>best){best=cur;bestFrom=curFrom;bestTo=m;}
    }else cur=0;
  });
  return {n:best,from:bestFrom,to:bestTo};
}
function widest(type){
  let best=null,bd=-1;
  sorted().forEach(m=>{
    if(outcome(m)!==type)return;
    let g=0,o=0;(m.sets||[]).forEach(s=>{g+=+s.me||0;o+=+s.opp||0});
    const diff=type==='W'?g-o:o-g;
    if(diff>bd){bd=diff;best=m;}
  });
  return best;
}
function streakWhen(s){
  if(!s.n)return '';
  const a=monthLabel(s.from.date), b=monthLabel(s.to.date);
  return a===b?a:a+' → '+b;
}
function recordsCard(){
  const all=sorted();
  if(!all.length)return '';
  const sw=bestStreak('W'), sl=bestStreak('L');
  const bigW=widest('W'), bigL=widest('L');

  const byM={};all.forEach(m=>{const k=(m.date||'').slice(0,7);if(k)(byM[k]=byM[k]||[]).push(m)});
  let bm=null,bmw=-1;
  Object.entries(byM).forEach(([k,ms])=>{const r=record(ms);if(r.w>bmw){bmw=r.w;bm={k,r};}});

  const byO={};all.forEach(m=>{const k=(m.opponent||'').trim();if(k)(byO[k]=byO[k]||[]).push(m)});
  let vo=null,vow=-1;
  Object.entries(byO).forEach(([k,ms])=>{const r=record(ms);if(r.w>vow){vow=r.w;vo={k,r};}});

  const line=(k,sub,v,col)=>`<div class="statline"><div class="k">${k}${sub?`<small>${sub}</small>`:''}</div>
    <div class="v"${col?` style="color:${col}"`:''}>${v}</div></div>`;

  let h=`<section class="card"><div class="clabel">Record personali</div>`;
  h+=line('Striscia di vittorie',streakWhen(sw)||'Nessuna',sw.n||'–','var(--win)');
  h+=line('Striscia di sconfitte',streakWhen(sl)||'Nessuna',sl.n||'–','var(--loss)');
  if(bigW)h+=line('Vittoria più netta',esc(bigW.opponent||'Avversario')+' · '+dateLabel(bigW.date),scoreStr(bigW),'var(--win)');
  if(bigL)h+=line('Sconfitta più netta',esc(bigL.opponent||'Avversario')+' · '+dateLabel(bigL.date),scoreStr(bigL),'var(--loss)');
  if(bm)h+=line('Miglior mese',monthLabel(bm.k+'-01'),bm.r.w+'V-'+bm.r.l+'S');
  if(vo)h+=line('Avversario più battuto',esc(vo.k),vo.r.w+'V-'+vo.r.l+'S');
  h+=`</section>`;
  return h;
}

/* --- calendario dell'anno --- */

function vOpp(name){

  let h=`<section class="card">

/* =========================================================
   RITAGLIO FOTO PROFILO
   ========================================================= */
const crop={img:null,base:1,scale:1,x:0,y:0,V:250,drag:null};
function openCropper(src){
  const img=new Image();
  img.onload=()=>{
    crop.img=img;crop.scale=1;
    crop.base=Math.max(crop.V/img.width,crop.V/img.height);
    const w=img.width*crop.base,h=img.height*crop.base;
    crop.x=(crop.V-w)/2;crop.y=(crop.V-h)/2;
    document.getElementById('cropimg').src=src;
    document.getElementById('cropzoom').value=100;
    document.getElementById('cropper').classList.remove('hidden');
    applyCrop();
  };
  img.onerror=()=>flash('Immagine non valida');
  img.src=src;
}
function applyCrop(){
  const el=document.getElementById('cropimg');
  if(!el||!crop.img)return;
  const eff=crop.base*crop.scale;
  const w=crop.img.width*eff,h=crop.img.height*eff,V=crop.V;
  crop.x=Math.min(0,Math.max(V-w,crop.x));
  crop.y=Math.min(0,Math.max(V-h,crop.y));
  el.style.width=w+'px';el.style.height=h+'px';
  el.style.transform=`translate(${crop.x}px,${crop.y}px)`;
}
function closeCropper(){
  document.getElementById('cropper').classList.add('hidden');
  crop.img=null;crop.drag=null;
  const f=document.getElementById('avfile');if(f)f.value='';
}
function saveCrop(){
  if(!crop.img)return;
  const eff=crop.base*crop.scale,V=crop.V,SZ=320;
  const c=document.createElement('canvas');c.width=c.height=SZ;
  const ctx=c.getContext('2d');
  ctx.drawImage(crop.img,-crop.x/eff,-crop.y/eff,V/eff,V/eff,0,0,SZ,SZ);
  S.profile.avatar=c.toDataURL('image/jpeg',.86);
  save();closeCropper();render();flash('Foto aggiornata');
}
(function initCropper(){
  const vw=document.getElementById('cropview');
  const zoom=document.getElementById('cropzoom');
  vw.addEventListener('pointerdown',e=>{
    if(!crop.img)return;
    crop.drag={px:e.clientX,py:e.clientY};
    vw.setPointerCapture(e.pointerId);
  });
  vw.addEventListener('pointermove',e=>{
    if(!crop.drag||!crop.img)return;
    crop.x+=e.clientX-crop.drag.px;
    crop.y+=e.clientY-crop.drag.py;
    crop.drag.px=e.clientX;crop.drag.py=e.clientY;
    applyCrop();
  });
  const end=e=>{crop.drag=null;try{vw.releasePointerCapture(e.pointerId)}catch(_){}};
  vw.addEventListener('pointerup',end);
  vw.addEventListener('pointercancel',end);
  zoom.addEventListener('input',()=>{
    if(!crop.img)return;
    const old=crop.scale;
    crop.scale=+zoom.value/100;
    const k=crop.scale/old, V=crop.V;
    crop.x=V/2-(V/2-crop.x)*k;
    crop.y=V/2-(V/2-crop.y)*k;
    applyCrop();
  });
})();

/* =========================================================
   EVENTI
   ========================================================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const A=t.dataset.act;
  switch(A){
    case 'go': go(t.dataset.v); break;
    case 'back': history.back(); break;
    case 'settheme': S.theme=t.dataset.k;save();render();break;
    case 'new': draft=newDraft();go('form');break;
    case 'detail': go('detail',t.dataset.id);break;
    case 'opp': go('opp',t.dataset.n);break;
    case 'mres':{
      const m=S.matches.find(x=>x.id===t.dataset.id);
      if(!m)break;
      const o=outcome(m);
      const box=document.getElementById('reveal');
      const txt=`<span class="rtit">${resLetter(o)==='V'?'✓':resLetter(o)==='X'?'✕':'='} ${resName(o)}</span>${esc(m.opponent||'Avversario')} · ${scoreStr(m)} · ${relDay(m.date)}`;
      if(box){
        box.className='reveal '+resClass(o);
        box.innerHTML=txt;
      }else{
        flash(resName(o)+' · '+(m.opponent||'Avversario')+' · '+scoreStr(m));
      }
      haptic();break;
    }
    case 'hmy': hmYear=+t.dataset.k;render();break;
    case 'setres': draft.result=t.dataset.k;haptic();render();break;
    case 'edit':{
      const m=S.matches.find(x=>x.id===t.dataset.id);
      if(m){draft=draftFrom(m);go('form');}
      break;
    }
    case 'del':{
      if(confirm('Eliminare questa partita?')){
        S.matches=S.matches.filter(x=>x.id!==t.dataset.id);save();flash('Partita eliminata');go('hist');}
      break;
    }
    case 'fsurf':{
      const k=t.dataset.k;
      filt.surf.has(k)?filt.surf.delete(k):filt.surf.add(k);
      render();break;
    }
    case 'fres':{
      const k=t.dataset.k;
      filt.res.has(k)?filt.res.delete(k):filt.res.add(k);
      render();break;
    }
    case 'surf': draft.surface=t.dataset.k;haptic();render();break;
    case 'stp':{
      const i=+t.dataset.i,s=t.dataset.s,d=+t.dataset.d;
      let v=draft.sets[i][s]===''?0:+draft.sets[i][s];
      v=Math.max(0,Math.min(30,v+d));
      draft.sets[i][s]=String(v);haptic();render();break;
    }
    case 'addset': draft.sets.push({me:'',opp:'',tb:''});render();break;
    case 'rmset': draft.sets.splice(+t.dataset.i,1);render();break;
    case 'savematch': saveMatch();break;
    case 'demo': loadDemo();break;
    case 'pickav': document.getElementById('avfile').click();break;
    case 'cropcancel': closeCropper();break;
    case 'cropsave': saveCrop();break;
    case 'login': cloudLogin();break;
    case 'logout':
      if(confirm('Disconnettere l\'account Google? I dati restano su questo dispositivo.'))cloudLogout();
      break;
    case 'wipe':
      if(confirm('Cancellare TUTTI i dati? Operazione irreversibile.')){
        S=blank();save();go('home');flash('Dati cancellati');}
      break;
    case 'q': break;
  }
});

/* salvataggio partita */
function saveMatch(){
  const d=draft;
  if(!d.result){flash('Scegli prima l\'esito della partita');return;}
  const raw=d.sets.filter(s=>s.me!==''&&s.opp!=='').map(s=>({me:+s.me,opp:+s.opp,tb:(s.tb||'').trim()}));
  if(!raw.length){flash('Inserisci almeno un set');return;}
  // in memoria i game restano sempre "prima i miei": se ho perso, giro
  const sets=d.result==='L'
    ? raw.map(s=>({me:s.opp,opp:s.me,tb:flipScore(s.tb)}))
    : raw;
  if(!d.opponent.trim())d.opponent='Avversario';
  const m={
    id:d.id||uid(),date:d.date,time:d.time,duration:+d.duration||60,result:d.result,
    opponent:d.opponent.trim(),surface:d.surface,court:(d.court||'').trim(),
    sets,notes:(d.notes||'').trim()
  };
  if(d.id){S.matches=S.matches.map(x=>x.id===d.id?m:x);}else{S.matches.push(m);}
  save();draft=null;
  flash(m.result==='W'?'✓ Vittoria registrata':m.result==='D'?'= Pareggio registrato':'Sconfitta registrata');
  go('detail',m.id);
}

    const sets=[];let result;
    if(roll<.08){
      const v=6+Math.floor(Math.random()*3);
      sets.push({me:v,opp:v,tb:''});result='D';
    }else{
      const win=roll<.58;result=win?'W':'L';
      const n=Math.random()<.35?3:2;
      for(let k=0;k<n;k++){
        const meWin=(k<2)?(k===0?win:(n===3?!win:win)):win;
        const a=meWin?6:Math.floor(Math.random()*5);
        const b=meWin?Math.floor(Math.random()*5):6;
        const tie=Math.random()<.18;
        sets.push(tie?{me:meWin?7:6,opp:meWin?6:7,tb:meWin?'7-5':'5-7'}:{me:a,opp:b,tb:''});
      }
    }
    out.push({id:uid(),date:d.toISOString().slice(0,10),time:ORARI[38+(i%4)],duration:DURATE[i%DURATE.length],
      result,opponent:names[i%names.length],surface:surf[i%surf.length],court:courts[i%courts.length],sets,
      notes:notes[i%notes.length]});
  }
  S.matches=out;
  if(!S.profile.name){
    S.profile=Object.assign(S.profile,{name:'Andrea',surname:'Dellerba',hand:'Mancino',
      age:'30',height:'167',city:'Rivalta di Torino',level:'4.NC',nat:'IT'});
  }
  save();go('home');flash('Dati di esempio caricati');
}

/* navigazione / tasto indietro */
window.addEventListener('popstate',e=>{
  view=(e.state&&e.state.v)||{n:'home'};render();
});
go=function(n,p){
  view={n,p};
  history.pushState({v:view},'','');
  window.scrollTo(0,0);render();
};
history.replaceState({v:view},'','');

render();
</script>
