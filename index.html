<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Game, Set & Match!</title>
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3F5EF" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game, Set & Match!">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400..900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   GAME, SET & MATCH! — design tokens
   Stile "Tabellone": fondo scuro, numeri luminosi, dati incolonnati,
   angoli arrotondati e bordi chiari. Menù Liquid Glass.
   Vittoria verde · Pareggio giallo · Sconfitta rossa
   Display: Bebas Neue · Testo: Work Sans
   ============================================================ */
:root{
  --optic:#D9F52B;
  --optic-deep:#B9D400;
  --clay:#C4593A;
  --clay-2:#E0785A;
  --hard:#1F5FA9;
  --hard-2:#3A87DA;
  --win:#2ED17A;
  --loss:#FF5C74;

  --radius:26px;
  --radius-s:16px;
  --safe-t:env(safe-area-inset-top, 0px);
  --safe-b:env(safe-area-inset-bottom, 0px);

  --f-sans:'Work Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --f-display:'Bebas Neue',var(--f-sans);
}
/* ---- SCURO (default) ---- */
:root, html[data-theme="dark"]{
  --bg:#000;
  --card-solid:#0A0C09;
  --card-brd:rgba(255,255,255,.14);
  --card-inner:rgba(217,245,43,.04);
  --txt:#EDF3E4;
  --txt-soft:rgba(237,243,228,.74);
  --txt-2:#96A08C;
  --txt-3:#6B7566;
  --field:rgba(255,255,255,.055);
  --field-brd:rgba(255,255,255,.14);
  --track:rgba(255,255,255,.08);
  --hm-empty:rgba(255,255,255,.06);
  --num:#D9F52B;
  --draw:#F5C93A;
  --glow-num:0 0 14px rgba(217,245,43,.5);
  --ring-glow:drop-shadow(0 0 6px rgba(217,245,43,.45));
  --stencil:rgba(217,245,43,.45);
  --glow:0 18px 44px -20px rgba(0,0,0,.95);
  --court:radial-gradient(120% 80% at 50% -10%, rgba(30,154,107,.16), transparent 62%),
          radial-gradient(90% 60% at 100% 0%, rgba(31,95,169,.12), transparent 60%);
  --scan:repeating-linear-gradient(rgba(255,255,255,.045) 0 1px, transparent 1px 3px);
  --scan-o:1;
  --glass-bg:rgba(255,255,255,.08);
  --glass-brd:rgba(255,255,255,.22);
  --glass-sheen:rgba(255,255,255,.16);
  --tab-off:rgba(255,255,255,.45);
  --tab-on-bg:rgba(255,255,255,.14);
  --tab-on:var(--optic);
}
/* ---- CHIARO ---- */
html[data-theme="light"]{
  --bg:#F3F5EF;
  --card-solid:#FFFFFF;
  --card-brd:rgba(16,28,14,.12);
  --card-inner:transparent;
  --txt:#101710;
  --txt-soft:rgba(16,23,16,.68);
  --txt-2:#586052;
  --txt-3:#8B948A;
  --field:rgba(16,28,14,.045);
  --field-brd:rgba(16,28,14,.13);
  --track:rgba(16,28,14,.09);
  --hm-empty:rgba(16,28,14,.07);
  --num:#67840A;
  --draw:#8A6A00;
  --glow-num:none;
  --ring-glow:none;
  --stencil:rgba(103,132,10,.5);
  --glow:0 16px 36px -22px rgba(12,40,28,.5);
  --court:radial-gradient(120% 80% at 50% -10%, rgba(30,154,107,.14), transparent 62%);
  --scan:none;
  --scan-o:0;
  --glass-bg:rgba(255,255,255,.6);
  --glass-brd:rgba(16,28,14,.14);
  --glass-sheen:rgba(255,255,255,.7);
  --tab-off:rgba(16,28,14,.42);
  --tab-on-bg:rgba(16,28,14,.07);
  --tab-on:#55710A;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font-family:var(--f-sans);
  font-size:16px;line-height:1.35;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
body::before{content:"";position:fixed;inset:0;background:var(--court);pointer-events:none;z-index:0}
body::after{content:"";position:fixed;inset:0;background:var(--scan);opacity:var(--scan-o);pointer-events:none;z-index:0}
input,select,textarea,button{font-family:inherit;font-size:16px;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column}
main{
  flex:1;padding:0 18px calc(var(--safe-b) + 120px);
  max-width:520px;width:100%;margin:0 auto;
}

/* ---------- header (stencil, centrato) ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  padding:calc(var(--safe-t) + 30px) 18px 14px;
  max-width:520px;margin:0 auto;width:100%;
  background:linear-gradient(to bottom,var(--bg) 70%,transparent);
}
/* riga del titolo: il tasto indietro si centra su questa, non sull'intera barra */
.tbrow{
  position:relative;display:flex;align-items:center;justify-content:center;
  min-height:38px;padding:0 44px;
}
.stencil{position:relative;display:inline-block;max-width:100%}
.stencil h1{
  margin:0;position:relative;z-index:2;
  font-family:var(--f-display);font-weight:400;font-size:29px;line-height:.95;letter-spacing:.025em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.stencil .ghost{
  position:absolute;left:0;right:0;top:-11px;z-index:1;pointer-events:none;
  font-family:var(--f-display);font-weight:400;font-size:29px;line-height:.95;letter-spacing:.025em;
  white-space:nowrap;overflow:hidden;
  color:transparent;-webkit-text-stroke:1px var(--stencil);
}
.stencil.sm h1,.stencil.sm .ghost{font-size:23px}
.stencil.sm .ghost{top:-9px}
.iconbtn{
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:var(--field);border:1px solid var(--field-brd);
}
.iconbtn:active{transform:translateY(-50%) scale(.92)}
.iconbtn svg{width:18px;height:18px;stroke:var(--txt);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- toast ---------- */
#pill{
  position:fixed;left:50%;transform:translate(-50%,-140%);
  top:calc(var(--safe-t) + 2px);z-index:200;
  display:flex;align-items:center;gap:9px;
  padding:9px 15px;border-radius:100px;
  background:#0B100D;color:#F2F6F1;border:1px solid rgba(255,255,255,.16);
  box-shadow:0 12px 30px -8px rgba(0,0,0,.8);
  font-size:13px;font-weight:700;
  transition:transform .42s cubic-bezier(.2,1.1,.3,1),opacity .3s;
  opacity:0;max-width:calc(100vw - 32px);
}
#pill.on{transform:translate(-50%,0);opacity:1}
#pill .dot{width:8px;height:8px;border-radius:50%;background:var(--optic);flex:none}
#pill .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- menù Liquid Glass ---------- */
nav.tabs{
  /* su iPhone si scende dentro parte dell'area sicura, restando sopra la gesture bar */
  position:fixed;left:14px;right:14px;bottom:calc(var(--safe-b) * .45 + 8px);z-index:60;
  max-width:452px;margin:0 auto;
  display:flex;gap:10px;align-items:stretch;
}
.tabbar{
  position:relative;display:flex;padding:0;
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(38px) saturate(220%);backdrop-filter:blur(38px) saturate(220%);
  border:.5px solid var(--glass-brd);border-radius:32px;
  box-shadow:var(--glow),inset 0 1px 0 var(--glass-sheen),inset 0 -1px 0 rgba(0,0,0,.2);
  overflow:hidden;
}
.tabbar::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,var(--glass-sheen) 0%,rgba(255,255,255,.03) 22%,rgba(255,255,255,0) 45%);
}
.pill-main{flex:1}
.pill-side{flex:0 0 auto}
.tabbtn{
  position:relative;z-index:1;flex:1;
  display:flex;align-items:center;justify-content:center;
  color:var(--tab-off);padding:18px 0;border-radius:28px;transition:color .2s;
}
.pill-side .tabbtn{flex:0 0 auto;padding:18px 21px}
.tabbtn.on{color:var(--tab-on)}
.tabbtn.on::before{
  content:'';position:absolute;inset:0;z-index:-1;border-radius:32px;
  background:var(--tab-on-bg);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 2px rgba(0,0,0,.15);
}
.tabbtn svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbtn:active{transform:scale(.94)}
.tab-plus{color:var(--tab-on)}
.tab-plus svg{stroke-width:2.4}

/* ---------- card ---------- */
.card{
  background:var(--card-solid);
  border:1px solid var(--card-brd);
  border-radius:var(--radius);
  padding:18px 16px;
  text-align:center;
  box-shadow:var(--glow),inset 0 0 40px var(--card-inner);
}
.card + .card{margin-top:13px}
.clabel{
  font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--txt-3);margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--card-brd);
}
.clabel em{font-style:normal;color:var(--txt-2);opacity:.75}
.clabel b{font-family:var(--f-display);font-weight:400;font-size:19px;letter-spacing:.04em;color:var(--num);text-shadow:var(--glow-num);vertical-align:-1px}
/* titolo grande: tutta la riga alla stessa dimensione dei numeri */
.clabel.big{
  font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.15;
  letter-spacing:.05em;color:var(--txt-2);
}
.clabel.big b{vertical-align:0}
.clabel.big em{font-size:19px;opacity:.6}
/* titolo e link sulla stessa riga, centrati, per compattare */
.sec{margin:24px 0 11px;display:flex;align-items:baseline;justify-content:center;gap:11px;text-align:center;flex-wrap:wrap}
.sec h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.05em;text-transform:uppercase}
.sec .hint{font-size:10px;color:var(--txt-3);font-weight:800;text-transform:uppercase;letter-spacing:.12em;background:none}

/* profilo / hero */
.avatar{
  width:78px;height:78px;border-radius:22px;flex:none;object-fit:cover;
  background:var(--field);border:1px solid var(--card-brd);
  display:grid;place-items:center;
  font-family:var(--f-display);font-size:32px;font-weight:400;
  color:var(--num);text-shadow:var(--glow-num);
}
.herotop{display:flex;align-items:center;justify-content:center;gap:16px}
.heroname{text-align:left;min-width:0}
.heroname .n1{font-family:var(--f-display);font-weight:400;font-size:25px;letter-spacing:.02em;line-height:1.02;color:var(--txt-2)}
.heroname .n2{font-family:var(--f-display);font-weight:400;font-size:31px;letter-spacing:.02em;line-height:1.02}
.heroname .flag{font-family:var(--f-sans);font-size:19px;vertical-align:2px;margin-left:7px;text-shadow:none}
.hero .meta{font-size:10.5px;color:var(--txt-2);font-weight:800;text-transform:uppercase;letter-spacing:.08em;line-height:1.7;margin-top:13px}
.hero .meta .lvl{color:var(--num);text-shadow:var(--glow-num)}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;padding-top:13px;border-top:1px solid var(--card-brd)}
.kpi{padding:0 4px}
.kpi + .kpi{border-left:1px solid var(--card-brd)}
.kpi b{
  display:block;font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.02em;
  color:var(--num);text-shadow:var(--glow-num);
}
.kpi span{font-size:9px;color:var(--txt-3);font-weight:800;text-transform:uppercase;letter-spacing:.1em;display:block;margin-top:3px}

/* segmented */
.seg{display:flex;gap:4px;padding:4px;background:var(--field);border-radius:100px;border:1px solid var(--field-brd)}
.seg button{flex:1;padding:9px 6px;border-radius:100px;font-size:12px;font-weight:800;color:var(--txt-2);transition:.18s;text-transform:uppercase;letter-spacing:.06em;min-width:0}
.seg button.on{background:var(--txt);color:var(--bg)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none;justify-content:center}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:8px 14px;border-radius:100px;font-size:12px;font-weight:800;
  background:var(--field);border:1px solid var(--field-brd);color:var(--txt-2);white-space:nowrap;
  text-transform:uppercase;letter-spacing:.05em;
}
.chip.on{background:var(--optic);border-color:var(--optic);color:#0F1508}
.chip.on.w{background:var(--win);border-color:var(--win);color:#04170D}
.chip.on.l{background:var(--loss);border-color:var(--loss);color:#2A0409}
.chip.on.d{background:#F5C93A;border-color:#F5C93A;color:#2A1F00}
.chip.on.clay{background:var(--clay);border-color:var(--clay);color:#2A0904}
.chip.on.hard{background:var(--hard);border-color:var(--hard);color:#04101F}

/* ricerca + h2h */
.searchrow{display:flex;gap:9px;margin-bottom:14px}
.searchrow #q{flex:1 1 auto;min-width:0;width:auto}
.searchrow .h2hsel{
  flex:0 0 auto;width:76px;padding:13px 8px;font-size:12px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:var(--num);text-align:center;text-align-last:center;
  background-image:none;padding-right:8px;
}

/* filtri storico */
.frow{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.flab{flex:none;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--txt-3);width:70px;text-align:left;line-height:1.2}
.fchips{flex:1;display:flex;gap:6px;min-width:0}
.fchips .chip{flex:1 1 0;min-width:0;padding:9px 4px;text-align:center;font-size:10px;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis}

/* badge superficie */
.sdot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}
.sbadge{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;
  font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#fff;
}
.sbadge i{width:6px;height:6px;border-radius:2px;background:rgba(255,255,255,.85);display:block}
.s-clay{background:linear-gradient(135deg,var(--clay),var(--clay-2))}
.s-hard{background:linear-gradient(135deg,var(--hard),var(--hard-2))}

/* card partita (riga + note) */
.mcard{
  background:var(--card-solid);border:1px solid var(--card-brd);border-radius:18px;
  margin-bottom:9px;position:relative;overflow:hidden;
  box-shadow:inset 0 0 30px var(--card-inner);
}
.mcard:active{transform:scale(.985)}
.mcard .bar{position:absolute;left:0;top:0;bottom:0;width:3px;z-index:1}
.b-clay{background:linear-gradient(var(--clay-2),var(--clay))}
.b-hard{background:linear-gradient(var(--hard-2),var(--hard))}
.mrow{display:flex;align-items:center;gap:11px;padding:13px 14px;text-align:left}
.mrow .res{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;margin-left:3px;
  font-family:var(--f-display);font-size:16px;font-weight:400;
}
.res.w,.fres.w,.fdot.w{background:rgba(46,209,122,.13);color:var(--win);border:1px solid rgba(46,209,122,.4)}
.res.l,.fres.l,.fdot.l{background:rgba(255,92,116,.11);color:var(--loss);border:1px solid rgba(255,92,116,.38)}
.res.d,.fres.d,.fdot.d{background:rgba(245,201,58,.14);color:var(--draw);border:1px solid rgba(245,201,58,.4)}
.mrow .mid{flex:1;min-width:0}
/* punteggio sulla stessa riga del cognome, allineato alla sua base */
.mtop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.mrow .opp{flex:1;min-width:0;font-size:13.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.mrow .sub{font-size:9.5px;color:var(--txt-soft);font-weight:700;margin-top:4px;text-transform:uppercase;letter-spacing:.05em;line-height:1.5}
.mnote{
  padding:9px 14px 11px 20px;border-top:1px solid var(--card-brd);text-align:left;
  font-size:11.5px;line-height:1.45;color:var(--txt-soft);
}
.mnote b{
  font-weight:800;color:var(--txt-3);text-transform:uppercase;letter-spacing:.1em;
  font-size:9.5px;margin-right:7px;
}
.score{display:flex;gap:7px;align-items:center;font-weight:800;font-size:14px;flex:none}
.score .st{position:relative;color:var(--win)}
.score .st.l{color:var(--loss)}
.score .st.d{color:var(--draw)}
.score .tb{position:absolute;top:-6px;right:-8px;font-size:9px;color:var(--txt-3);font-weight:700}
/* marcatore per un punteggio che è un tie-break vero e proprio */
.score .tbm{font-style:normal;font-size:7.5px;font-weight:800;color:var(--num);vertical-align:6px;margin-left:2px;letter-spacing:.04em}

/* forma recente */
.fgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:4px}
.fres{
  width:100%;aspect-ratio:1;border-radius:7px;display:grid;place-items:center;
  font-family:var(--f-display);font-weight:400;font-size:14px;line-height:1;
}
.fres:active{transform:scale(.9)}
.reveal{
  border-radius:14px;padding:12px 14px;margin-bottom:13px;border:1px solid transparent;
  font-size:13px;font-weight:800;letter-spacing:.03em;line-height:1.45;
}
.reveal .rtit{font-family:var(--f-display);font-weight:400;font-size:19px;letter-spacing:.05em;display:block;margin-bottom:2px}
.reveal.w{background:rgba(46,209,122,.12);color:var(--win);border-color:rgba(46,209,122,.32)}
.reveal.l{background:rgba(255,92,116,.1);color:var(--loss);border-color:rgba(255,92,116,.3)}
.reveal.d{background:rgba(245,201,58,.12);color:var(--draw);border-color:rgba(245,201,58,.34)}

/* grafici */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;align-items:start}
.ring{position:relative;width:100%;max-width:104px;margin:0 auto}
.ring svg{display:block;width:100%;height:auto}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid b{
  display:block;font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:.02em;
  color:var(--num);text-shadow:var(--glow-num);
}
.ringlab{margin-top:8px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--txt-3)}
.ringsub{font-size:10.5px;font-weight:700;color:var(--txt-2);margin-top:2px;font-variant-numeric:tabular-nums}
.ringarc{filter:var(--ring-glow)}

.glegend{display:flex;justify-content:center;gap:18px;margin-top:12px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--txt-3)}
.glegend i{width:14px;height:3px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:3px}

.bars{display:flex;flex-direction:column;gap:14px;text-align:left}
.bline .t{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:800;margin-bottom:7px;text-transform:uppercase;letter-spacing:.05em;gap:8px}
.bline .t span{color:var(--txt-3);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.03em;white-space:nowrap}
.track{height:8px;border-radius:100px;background:var(--track);overflow:hidden}
.fill{height:100%;border-radius:100px;transition:width .6s cubic-bezier(.2,.9,.3,1)}

/* superfici: barra unica sfumata */
.blend .r2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.blend .r2 small{display:block;font-size:10px;color:var(--txt-3);font-weight:700;letter-spacing:.03em;margin-top:2px;text-transform:none}
.blend .r2 .b{text-align:right}

.formrow{display:flex;gap:5px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.fdot{width:23px;height:23px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-display);font-size:13px}

.hmlegend{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px;font-size:9.5px;color:var(--txt-3);font-weight:700;text-transform:uppercase;letter-spacing:.06em;flex-wrap:wrap}
.hmlegend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* form */
label.fl{display:block;font-size:10px;font-weight:800;color:var(--txt-3);text-transform:uppercase;letter-spacing:.12em;margin:0 0 8px 3px;text-align:left}
.field{
  width:100%;max-width:100%;min-width:0;padding:13px 14px;border-radius:15px;background:var(--field);
  border:1px solid var(--field-brd);color:var(--txt);outline:none;transition:.18s;
  appearance:none;-webkit-appearance:none;
}
input.field[type="date"]{padding:12px 12px;font-variant-numeric:tabular-nums}
select.field{
  padding-right:34px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.field:focus{border-color:var(--optic);box-shadow:0 0 0 3px rgba(217,245,43,.14)}
textarea.field{min-height:96px;resize:none;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>div{min-width:0}
.fgroup{margin-bottom:16px}

/* selettore esito nel form */
.respick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.rpick{
  padding:13px 6px;border-radius:14px;font-family:var(--f-display);font-weight:400;font-size:19px;
  letter-spacing:.05em;border:1px solid var(--field-brd);background:var(--field);color:var(--txt-3);
  transition:.18s;
}
.rpick:active{transform:scale(.96)}
.rpick.on.w{background:rgba(46,209,122,.16);color:var(--win);border-color:rgba(46,209,122,.55)}
.rpick.on.d{background:rgba(245,201,58,.16);color:var(--draw);border-color:rgba(245,201,58,.55)}
.rpick.on.l{background:rgba(255,92,116,.14);color:var(--loss);border-color:rgba(255,92,116,.5)}

.surfpick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.spick{
  display:flex;align-items:center;justify-content:center;gap:9px;
  border-radius:14px;padding:13px 8px;border:1px solid var(--field-brd);
  background:var(--field);transition:.2s;
}
.spick .ic{width:18px;height:18px;border-radius:6px;flex:none}
.spick .nm{font-size:11px;font-weight:800;color:var(--txt-2);letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.spick.on{border-color:transparent}
.spick.on .nm{color:#fff}
.spick.on.c{background:linear-gradient(150deg,var(--clay),var(--clay-2))}
.spick.on.h{background:linear-gradient(150deg,var(--hard),var(--hard-2))}
.spick.on .ic{background:rgba(255,255,255,.9)!important}

.setrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.setrow .lbl{font-size:10px;font-weight:800;color:var(--txt-3);width:38px;text-transform:uppercase;letter-spacing:.06em}
.setrow .lbl.tbl{color:var(--num);text-shadow:var(--glow-num)}
.stepper{display:flex;align-items:center;gap:2px;background:var(--field);border:1px solid var(--field-brd);border-radius:14px;padding:3px;flex:1;min-width:0}
.stepper button{width:30px;height:34px;border-radius:11px;font-size:19px;font-weight:600;color:var(--txt-2);display:grid;place-items:center;flex:none}
.stepper button:active{background:var(--card-brd)}
.stepper input{flex:1;width:100%;min-width:0;text-align:center;background:none;border:0;outline:none;font-size:19px;font-weight:800;padding:0}
.stepper input::placeholder{color:var(--txt-3);opacity:.4;font-weight:600}
.setrow .vs{color:var(--txt-3);font-weight:800;flex:none}
.setrow .rm{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--txt-3);background:var(--field);flex:none;font-size:15px}
.tbf{display:flex;align-items:center;gap:8px;margin:-2px 0 12px 46px}
.tbf input{width:96px;padding:8px 10px;font-size:13px}
.tbf span{font-size:10px;color:var(--txt-3);font-weight:800;letter-spacing:.08em}
.fhint{font-size:10px;color:var(--txt-3);font-weight:700;margin:-6px 0 14px 3px;text-align:left;line-height:1.5}

.btn{
  width:100%;padding:16px;border-radius:18px;font-size:15px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  background:linear-gradient(160deg,var(--optic),var(--optic-deep));color:#0F1508;
  box-shadow:0 14px 28px -14px rgba(217,245,43,.8);
}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--field);border:1px solid var(--field-brd);color:var(--txt);box-shadow:none}
.btn.danger{background:rgba(255,92,116,.12);border:1px solid rgba(255,92,116,.3);color:var(--loss);box-shadow:none}
.btn.sm{padding:12px;font-size:13px;border-radius:15px}

/* dettaglio match — griglia stile tabellone televisivo */
.mhead{border-radius:var(--radius);overflow:hidden;margin-bottom:13px;color:#fff}
.mh-inner{background:rgba(6,10,6,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
/* data e orario: una riga sola, centrata su tutta la larghezza */
.mh-meta{
  padding:16px 16px 14px;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  font-size:12.5px;font-weight:800;letter-spacing:.1em;

}
.mh-meta i{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.45);display:block;flex:none}
.mh-grid{padding:4px 16px 14px}
/* il circolo occupa lo spazio libero a sinistra delle colonne dei set,

.mh-hd{display:flex;align-items:center;gap:12px;padding:12px 0 7px}

  flex:1;min-width:0;padding-left:14px;

}
.mh-hd .cols{display:flex;gap:7px;flex:none}
.mh-hd .cols span{width:34px;text-align:center;font-size:8.5px;font-weight:800;letter-spacing:.05em;color:rgba(255,255,255,.5)}
.mh-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.13)}
.mh-nm{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.mh-nm .bar{width:4px;height:36px;border-radius:2px;background:rgba(255,255,255,.26);flex:none}
.mh-row.win .mh-nm .bar{background:var(--optic)}
.mh-nm .t{min-width:0}
.mh-nm .f{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.58);line-height:1;

.mh-nm .l{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.05;letter-spacing:.025em;
  color:#fff;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh-row.lose .mh-nm .l{color:rgba(255,255,255,.66)}
.mh-sc{display:flex;gap:7px;flex:none}
/* chi vince il set ha il numero pieno, a prescindere da come finisce la partita */
.mh-sc b{
  width:34px;text-align:center;font-size:19px;font-weight:600;color:rgba(255,255,255,.45);
  font-variant-numeric:tabular-nums;position:relative;
}
.mh-sc b.w{color:#fff;font-weight:900}
.mh-sc b sup{font-size:9px;font-weight:700;opacity:.75;margin-left:1px}

.statline{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--card-brd);text-align:left}
.statline:last-child{border:0;padding-bottom:0}
.statline .k{flex:1;font-size:12px;color:var(--txt-2);font-weight:700;text-transform:uppercase;letter-spacing:.05em;min-width:0}
.statline .k small{display:block;font-size:10.5px;color:var(--txt-3);font-weight:600;text-transform:none;letter-spacing:0;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statline .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.statline.tap{cursor:pointer}
.statline.tap:active{opacity:.6}
.statline .go{color:var(--txt-3);font-size:15px;flex:none}

.note{background:var(--field);border-left:3px solid var(--optic);border-radius:0 14px 14px 0;padding:12px 14px;font-size:14px;line-height:1.5;color:var(--txt-2);text-align:left}

.empty{text-align:center;padding:46px 20px;color:var(--txt-3)}
.empty .ball{width:62px;height:62px;margin:0 auto 14px;opacity:.9}
.empty h3{margin:0 0 6px;font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--txt);letter-spacing:.03em}
.empty p{margin:0;font-size:13.5px;line-height:1.5}

/* ritaglio foto profilo */
.cropwrap{
  position:fixed;inset:0;z-index:180;display:flex;align-items:center;justify-content:center;padding:22px;
  background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.cropbox{
  width:100%;max-width:330px;background:var(--card-solid);border:1px solid var(--card-brd);
  border-radius:24px;padding:20px 18px;text-align:center;
}
.cropview{
  width:250px;height:250px;margin:0 auto;border-radius:22px;overflow:hidden;position:relative;
  background:#000;border:1px solid var(--card-brd);touch-action:none;cursor:grab;
}
.cropview img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.cropview:active{cursor:grabbing}
.crange{width:100%;margin:14px 0 4px;accent-color:var(--optic)}
.crophint{font-size:10.5px;color:var(--txt-3);font-weight:700;margin-top:10px;line-height:1.5}

.fade{animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.fill{transition:none}}
.hidden{display:none!important}
.spacer{height:8px}
</style>

<script>
/* =========================================================
   STATO
   ========================================================= */
const KEY='myTennis.v1';
const SURF={
  clay  :{n:'Terra',   cls:'clay',  c:'--clay-2',  pk:'c'},
  hard  :{n:'Cemento', cls:'hard',  c:'--hard-2',  pk:'h'}
};
const SKEYS=Object.keys(SURF);
const MESI=['GEN','FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC'];
const ORARI=(()=>{const a=[];for(let h=0;h<24;h++){a.push(String(h).padStart(2,'0')+':00');a.push(String(h).padStart(2,'0')+':30');}return a;})();
const DURATE=[60,90,120,150,180,210,240];
const NAZ=[['IT','Italia'],['AL','Albania'],['AR','Argentina'],['AT','Austria'],['BE','Belgio'],['BR','Brasile'],
  ['HR','Croazia'],['FR','Francia'],['DE','Germania'],['GR','Grecia'],['MA','Marocco'],['NL','Paesi Bassi'],
  ['PL','Polonia'],['PT','Portogallo'],['GB','Regno Unito'],['RO','Romania'],['RU','Russia'],['RS','Serbia'],
  ['ES','Spagna'],['US','Stati Uniti'],['SE','Svezia'],['CH','Svizzera'],['TN','Tunisia'],['UA','Ucraina']];

const blankProfile=()=>({name:'',surname:'',hand:'Destro',level:'',avatar:'',age:'',nat:'IT',city:'',height:''});
const blank=()=>({profile:blankProfile(),matches:[],theme:''});
let S=load();
let view={n:'home'};
let draft=null;
let filt={surf:new Set(SKEYS), res:new Set(['W','D','L']), q:''};
let hmYear=new Date().getFullYear();
let gid=0;

function load(){
  try{
    const r=JSON.parse(localStorage.getItem(KEY));
    if(r&&r.matches){
      const o=Object.assign(blank(),r);
      o.profile=Object.assign(blankProfile(),r.profile||{});
      // vecchio campo unico "name" → nome + cognome
      if(!o.profile.surname&&o.profile.name&&o.profile.name.trim().includes(' ')){
        const p=o.profile.name.trim().split(/\s+/);
        o.profile.name=p.shift();
        o.profile.surname=p.join(' ');
      }
      return o;
    }
  }catch(e){}
  return blank();
}
function save(){S.touchedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(S));cloudPush();}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ── sistemazione una tantum delle partite caricate dal backup ──
   Quelle 150 partite non avevano orario scelto, durata né campo: all'epoca i
   campi non esistevano ancora. Qui ricevono un orario reale, un'ora di durata
   e il circolo giusto per anno e superficie.
   Il marcatore sta sulla singola partita, non sull'insieme: così funziona anche
   quando le partite arrivano dal cloud dopo l'avvio, e non si ripete. */
const DATA_FIX=2;
const ORARI_REALI=['10:00','11:00','12:00','17:00','18:00','19:00','20:00','21:00'];
const CIRCOLI_TERRA=['Momy Sport Village','Monviso Sporting Club','Fornaci','Circoletto Rosso',
                     'Trecate 46','Nord Tennis','Master Club'];
const CIRCOLI_CEMENTO=['De Coubertin','Momy Sport Village'];
/* ── nomi degli avversari ──
   Le partite del backup avevano solo il cognome. Qui arriva il nome di battesimo.
   Non serve un marcatore: una volta scritto il nome, la partita viene saltata,
   e le partite dove il nome l'hai messo tu non vengono mai toccate. */
const NOMI_AVVERSARI={
  "ambrosi":"Stefano","amodeo":"Davide","armentano":"Marco","battaglino":"Fabrizio",
  "bellone":"Edoardo","bertero":"Paolo","bianchini":"Bruno","birro":"Valter",
  "bonello":"Paolo","borda":"Enzo","calitri":"Claudio","calo":"Marco",
  "cambareri":"Rocco","carchia":"Giuseppe","cardella":"Giuseppe","cileo":"Pierluigi",
  "correale":"Caterina","d'avanzo":"Raffaele","de rosa":"Raffaele","delfino":"Daniele",
  "dellerba":"Michele","di maria":"Andrea","esposito":"Davide","fabris":"Alessandro",
  "federico":"Andrea","fornaro":"Edoardo","giuffrida":"Simone","goria":"Luca",
  "la rocca":"Roberto","lavilla":"Alessandro","leto":"Simone","longo":"Simone",
  "marabotto":"Adolfo","marusich":"Mattia","mazza":"Giuseppe","morello":"Diego",
  "morino":"Fabrizio","morra":"Andrea","moscaritolo":"Fabrizio","murati":"Michelangelo",
  "musarella":"Giorgio","pacileo":"Lino","petrazzi":"Mirko","picco":"Giorgio",
  "piva":"Stefano","pontone":"Riccardo","ponzo":"Andrea","porporato":"Riccardo",
  "porri":"Andrea","rinaldi":"Edoardo","rolle":"Stefano","rosotto":"Giovanni",
  "ruffinello":"Federico","ruggiero":"Simone","santarelli":"Francesco","schaffner":"Thomas",
  "sembenelli":"Riccardo","sicco":"Varner","sollazzo":"Paolo","tarricone":"Francesco",
  "testa":"Daniele","uliano":"Guido","vai":"Dario","valentina":"Valentian",
  "villani":"Michele","visconti":"Alessandro","voltarel":"Michele","vuerich":"Max",
  "zito":"Fabio"
};
function fixNames(){
  let n=0;
  (S.matches||[]).forEach(m=>{
    if(m.updatedAt)return;                    // salvata da te: è definitiva
    if((m.oppFirst||'').trim())return;        // nome già presente: non lo tocco
    const p=oppParts(m);
    const nome=NOMI_AVVERSARI[p.last.trim().toLowerCase()];
    if(!nome)return;
    m.oppFirst=nome;
    m.opponent=p.last;                        // ripulisce anche "Marusich M."
    n++;
  });
  if(n){localStorage.setItem(KEY,JSON.stringify(S));cloudPush();}
  return n;
}

function fixImported(){
  const a=arr=>arr[Math.floor(Math.random()*arr.length)];
  let n=0;
  (S.matches||[]).forEach(m=>{
    if(m.updatedAt)return;                     // salvata da te: è definitiva
    // le partite del backup: id "imp…", oppure senza esito salvato (quelle del
    // form ce l'hanno sempre, perché l'esito lo scegli tu prima di registrare)
    if(!/^imp/.test(m.id||'') && m.result)return;
    if((m.fix||0)>=DATA_FIX)return;            // marcatore sulla singola partita
    if(ORARI_REALI.indexOf(m.time)<0)m.time=a(ORARI_REALI);
    if(!m.duration)m.duration=60;
    const y=(m.date||'').slice(0,4);
    if(y==='2026')m.court='Laurera 15A40';
    else if(y==='2024'||y==='2025')m.court=a(m.surface==='clay'?CIRCOLI_TERRA:CIRCOLI_CEMENTO);
    m.fix=DATA_FIX;
    n++;
  });
  if(n){localStorage.setItem(KEY,JSON.stringify(S));cloudPush();}
  return n;
}

/* =========================================================
   CLOUD SYNC (Firebase Auth + Realtime Database)
   ========================================================= */
let cloudUser=null, cloudTimer=null, cloudBusy=false;
function initCloud(){
  const fb=window.firebase;
  fb.onAuthStateChanged(fb.auth, user=>{
    cloudUser=user;
    if(user) cloudPull();
    render();
  });
}
function cloudLogin(){
  const fb=window.firebase;
  if(!fb){flash('Servizio non disponibile, riprova tra poco');return;}
  fb.signInWithPopup(fb.auth, new fb.GoogleAuthProvider()).catch(err=>{
    console.error('[gsm] login error',err);
    if(err&&(err.code==='auth/popup-blocked'||err.code==='auth/cancelled-popup-request'||err.code==='auth/operation-not-supported-in-this-environment')){
      fb.signInWithRedirect(fb.auth, new fb.GoogleAuthProvider());
    }else if(err&&err.code!=='auth/popup-closed-by-user'){
      flash('Accesso non riuscito ('+(err&&err.code||'errore')+')');
    }
  });
}
function cloudLogout(){
  const fb=window.firebase;
  fb.signOut(fb.auth);
  cloudUser=null;render();
}
function pushNow(){
  if(!cloudUser||!window.firebase)return;
  clearTimeout(cloudTimer);cloudTimer=null;
  const fb=window.firebase;
  fb.set(fb.ref(fb.db,'users/'+cloudUser.uid),{
    profile:S.profile, matches:S.matches, theme:S.theme,
    deleted:S.deleted||[], updatedAt:S.touchedAt||Date.now()
  }).catch(()=>{});
}
function cloudPush(){
  if(!cloudUser||!window.firebase)return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(pushNow,800);
}
/* Chiudendo l'app il salvataggio ritardato non farebbe in tempo a partire:
   qui lo si manda subito appena la pagina passa in secondo piano. */
function cloudFlush(){ if(cloudTimer)pushNow(); }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden')cloudFlush(); });
window.addEventListener('pagehide',cloudFlush);
async function cloudPull(){
  if(!cloudUser||cloudBusy)return;
  cloudBusy=true;
  try{
    const fb=window.firebase;
    const snap=await fb.get(fb.ref(fb.db,'users/'+cloudUser.uid));
    if(snap.exists())mergeFromCloud(snap.val());
    else cloudPush();
  }catch(e){}
  cloudBusy=false;
}
function mergeFromCloud(remote){
  const rTime=+remote.updatedAt||0, lTime=+S.touchedAt||0;

  // cancellazioni: unione delle due liste, così una partita eliminata non torna
  const tombs={};
  (S.deleted||[]).concat(remote.deleted||[]).forEach(d=>{
    if(d&&d.id&&(tombs[d.id]||0)<(+d.at||0))tombs[d.id]=+d.at||0;
  });

  // partite: per ogni id vince la versione modificata più di recente,
  // non più sempre quella del cloud (era questo a far sparire le modifiche)
  const map={};
  (S.matches||[]).forEach(m=>map[m.id]=m);
  (remote.matches||[]).forEach(r=>{
    const l=map[r.id];
    if(!l||(+r.updatedAt||0)>=(+l.updatedAt||0))map[r.id]=r;
  });
  S.matches=Object.values(map).filter(m=>{
    const t=tombs[m.id];
    return !(t&&t>(+m.updatedAt||0));   // cancellata dopo l'ultima modifica
  });
  S.deleted=Object.keys(tombs).map(id=>({id,at:tombs[id]})).slice(-200);

  // profilo e tema: si prende il cloud solo se più recente di quanto hai in locale
  if(remote.profile&&(rTime>lTime||!S.profile.name))S.profile=Object.assign(S.profile,remote.profile);
  if(remote.theme&&rTime>lTime)S.theme=remote.theme;

  localStorage.setItem(KEY,JSON.stringify(S));
  fixImported();fixNames();   // i dati arrivati dal cloud possono essere ancora da sistemare
  cloudPush();                // riallinea il cloud col risultato dell'unione
  applyTheme();render();
}

/* =========================================================
   HELPERS PARTITE
   ========================================================= */
function setsWon(m){
  let a=0,b=0;
  (m.sets||[]).forEach(s=>{ if(s.me>s.opp)a++; else if(s.opp>s.me)b++; });
  return [a,b];
}
/* l'esito scelto a mano vince; per le partite vecchie si calcola dai set */
function outcome(m){
  if(m&&(m.result==='W'||m.result==='D'||m.result==='L'))return m.result;
  if(!m||!m.sets||!m.sets.length)return null;
  const [a,b]=setsWon(m);
  if(a===b)return 'D';
  return a>b?'W':'L';
}
function resClass(o){return o==='W'?'w':o==='L'?'l':o==='D'?'d':'';}
function resLetter(o){return o==='W'?'V':o==='L'?'X':o==='D'?'P':'–';}
function resName(o){return o==='W'?'Vittoria':o==='L'?'Sconfitta':o==='D'?'Pareggio':'—';}
function flipScore(t){
  if(!t)return t;
  const p=String(t).split('-');
  return p.length===2?p[1].trim()+'-'+p[0].trim():t;
}
/* i set si mostrano sempre col vincitore per primo:
   partita persa → girati; partita vinta o pareggiata → come sono stati inseriti */
function dispSets(m){
  const flip=outcome(m)==='L';
  return (m.sets||[]).map(s=>{
    const mine=+s.me||0, theirs=+s.opp||0;
    return {
      a: flip?theirs:mine,
      b: flip?mine:theirs,
      tb: flip?flipScore(s.tb):s.tb,
      tbk: s.kind==='tb',                        // riga che è un tie-break, non un set
      cls: mine>theirs?'w':theirs>mine?'l':'d'   // colore dal mio punto di vista
    };
  });
}
function scoreStr(m){return dispSets(m).map(s=>s.a+'-'+s.b).join(' ')||'–';}
function myName(){
  const p=S.profile;
  return [p.name,p.surname].filter(Boolean).join(' ').trim();
}
/* Avversario: nome e cognome separati. Le partite vecchie hanno un campo unico,
   quindi provo a separare l'iniziale puntata ("M. Rossi", "Marusich M."). */
function oppParts(m){
  if(m&&m.oppFirst!==undefined)return{first:(m.oppFirst||'').trim(),last:(m.opponent||'').trim()};
  const t=((m&&m.opponent)||'').trim();
  let x=t.match(/^([A-Za-zÀ-ÿ]\.)\s+(.+)$/);      // "M. Rossi"
  if(x)return{first:x[1],last:x[2]};
  x=t.match(/^(.+?)\s+([A-Za-zÀ-ÿ]\.)$/);          // "Marusich M."
  if(x)return{first:x[2],last:x[1]};
  return{first:'',last:t};
}
function oppFull(m){const p=oppParts(m);return [p.first,p.last].filter(Boolean).join(' ')||'Avversario';}
function oppLast(m){return oppParts(m).last||'Avversario';}
/* il raggruppamento (testa a testa, avversari frequenti) usa il cognome */
function oppKey(m){return oppParts(m).last.trim().toLowerCase();}
function oppDisplay(key){
  const k=(key||'').trim().toLowerCase();
  const m=sorted().find(x=>oppKey(x)===k);
  return m?oppFull(m):(key||'Avversario');
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function sorted(){return S.matches.slice().sort((x,y)=>(y.date+ (y.time||'')).localeCompare(x.date+(x.time||'')));}

function record(list){
  let w=0,l=0,d=0;
  list.forEach(m=>{const o=outcome(m);if(o==='W')w++;else if(o==='L')l++;else if(o==='D')d++;});
  const tot=w+l+d;
  return {w,l,d,tot,pct:tot?Math.round(w/tot*100):0};
}
/* record scritto in ordine vittorie-pareggi-sconfitte */
function recStr(r){return r.d?`${r.w}-${r.d}-${r.l}`:`${r.w}-${r.l}`;}
/* i punti di un tie-break non sono game, quindi non entrano nel conteggio */
function gamesRec(list){
  let g=0,o=0;
  list.forEach(m=>(m.sets||[]).forEach(s=>{
    if(s.kind==='tb')return;
    g+=+s.me||0;o+=+s.opp||0;
  }));
  return{g,o};
}
function setsRec(list){
  let a=0,b=0;list.forEach(m=>{const[x,y]=setsWon(m);a+=x;b+=y;});return{a,b};
}
function dateLabel(iso,time){
  const d=new Date(iso+'T00:00:00');
  const s=d.toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'});
  return time?s+' · '+time:s;
}
/* data per esteso: "14 luglio 2026" */
function dateFull(iso){
  const d=new Date(iso+'T00:00:00');
  return d.toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'});
}
/* ora di fine ricavata da inizio + durata */
function endTime(t,dur){
  const p=String(t||'').split(':');
  if(p.length!==2)return '';
  const tot=(+p[0])*60+(+p[1])+(+dur||0);
  return String(Math.floor(tot/60)%24).padStart(2,'0')+':'+String(tot%60).padStart(2,'0');
}
/* "19:00 - 20:30", oppure solo l'inizio se non c'è la durata */
function timeRange(m){
  if(!m.time)return '';
  const e=m.duration?endTime(m.time,m.duration):'';
  return e?m.time+' - '+e:m.time;
}
function monthLabel(iso){
  const d=new Date(iso+'T00:00:00');
  return cap(d.toLocaleDateString('it-IT',{month:'long',year:'numeric'}));
}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
function durLabel(min){
  const h=Math.floor(min/60),m=min%60;
  return h+(h===1?' ora':' ore')+(m?' e '+m:'');
}
function flagEmoji(cc){
  cc=(cc||'').trim().toUpperCase();
  if(!/^[A-Z]{2}$/.test(cc))return '';
  return String.fromCodePoint(...[...cc].map(c=>0x1F1E6+c.charCodeAt(0)-65));
}
function uniqueField(f){
  const seen=new Map();
  S.matches.forEach(m=>{
    const v=(m[f]||'').trim();if(!v)return;
    const k=v.toLowerCase();
    if(!seen.has(k))seen.set(k,{v,n:0});
    seen.get(k).n++;
  });
  return [...seen.values()].sort((a,b)=>b.n-a.n||a.v.localeCompare(b.v)).map(x=>x.v);
}

/* linea game fatti (verde) contro game subiti (rosso) */
function gamesChart(list){
  const seq=list.slice().reverse();
  if(seq.length<2)return '<div style="color:var(--txt-3);font-size:12px">Servono almeno due partite.</div>';
  const mine=[],theirs=[];
  seq.forEach(m=>{
    let g=0,o=0;(m.sets||[]).forEach(s=>{g+=+s.me||0;o+=+s.opp||0});
    mine.push(g);theirs.push(o);
  });
  const peak=Math.max(1,...mine,...theirs);
  const max=Math.ceil(peak/4)*4;              // arrotonda per avere tacche intere
  const W=300,H=124,L=22,R=4,T=8,B=10;
  const X=i=>L+i/(seq.length-1)*(W-L-R);
  const Y=v=>H-B-(v/max)*(H-B-T);
  const path=a=>a.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const dots=(a,col)=>a.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.4" fill="${col}"/>`).join('');
  let grid='';
  for(let k=0;k<=4;k++){
    const v=Math.round(max*k/4), y=Y(v);
    grid+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}" stroke="var(--card-brd)" stroke-width="1"${k?' stroke-dasharray="3 5"':''}/>`;
    grid+=`<text x="${L-5}" y="${(y+3).toFixed(1)}" text-anchor="end" fill="var(--txt-3)" font-size="8" font-weight="700">${v}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible">
    ${grid}
    <path d="${path(theirs)}" fill="none" stroke="var(--loss)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${path(mine)}" fill="none" stroke="var(--win)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots(theirs,'var(--loss)')}${dots(mine,'var(--win)')}
  </svg>
  <div class="glegend">
    <span><i style="background:var(--win)"></i>Game fatti</span>
    <span><i style="background:var(--loss)"></i>Game subiti</span>
  </div>`;
}
/* calendario dell'anno: un quadratino per giorno */
function heatmap(year){
  const day={};
  S.matches.forEach(m=>{
    if(!m.date||m.date.slice(0,4)!==String(year))return;
    const o=outcome(m);if(!o)return;
    const d=(day[m.date]=day[m.date]||{w:0,l:0,d:0});
    if(o==='W')d.w++;else if(o==='L')d.l++;else d.d++;
  });
  const jan=new Date(year,0,1);
  const start=new Date(jan);
  start.setDate(start.getDate()-((jan.getDay()+6)%7));
  const CELL=9,GAP=2.6,STEP=CELL+GAP,COLS=53;
  const W=COLS*STEP,H=14+7*STEP;
  let cells='',labels='',lastMon=-1;
  for(let c=0;c<COLS;c++){
    for(let r=0;r<7;r++){
      const dt=new Date(start);dt.setDate(dt.getDate()+c*7+r);
      if(dt.getFullYear()!==year)continue;
      const iso=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
      const rec=day[iso];
      let f='var(--hm-empty)';
      if(rec)f = rec.w>rec.l ? 'var(--win)' : rec.l>rec.w ? 'var(--loss)' : 'var(--draw)';
      cells+=`<rect x="${(c*STEP).toFixed(1)}" y="${(14+r*STEP).toFixed(1)}" width="${CELL}" height="${CELL}" rx="2.4" fill="${f}"/>`;
      if(r===0&&dt.getMonth()!==lastMon){
        lastMon=dt.getMonth();
        labels+=`<text x="${(c*STEP).toFixed(1)}" y="8" fill="var(--txt-3)" font-size="7.5" font-weight="700" letter-spacing=".4">${MESI[dt.getMonth()]}</text>`;
      }
    }
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${labels}${cells}</svg>`;
}

/* barra unica: più giochi su una superficie, più il colore tende a quella */
function surfaceBlend(all,label){
  const rc=record(all.filter(m=>m.surface==='clay'));
  const rh=record(all.filter(m=>m.surface==='hard'));
  const tot=rc.tot+rh.tot;
  if(!tot)return '';
  const p=Math.round(rc.tot/tot*100);
  const a=Math.max(0,p-16), b=Math.min(100,p+16);
  return `<section class="card">
    <div class="clabel">${label||'Superfici <em>· all-time</em>'}</div>
    <div class="blend">
      <div class="r2" style="margin-bottom:9px">
        <div style="color:var(--clay-2)">Terra<small>${rc.tot} partite · ${rc.pct}%</small></div>
        <div class="b" style="color:var(--hard-2)">Cemento<small>${rh.tot} partite · ${rh.pct}%</small></div>
      </div>
      <div class="track" style="height:12px">
        <div class="fill" style="width:100%;background:linear-gradient(90deg,var(--clay) 0%,var(--clay-2) ${a}%,var(--hard-2) ${b}%,var(--hard) 100%)"></div>
      </div>
      <div class="r2" style="margin-top:9px">
        <div><small>${rc.w}V · ${rc.d}P · ${rc.l}S</small></div>
        <div class="b"><small>${rh.w}V · ${rh.d}P · ${rh.l}S</small></div>
      </div>
    </div>
  </section>`;
}

function mrow(m){
  const o=outcome(m),s=SURF[m.surface]||SURF.hard;
  const sc=dispSets(m).map(x=>
    `<div class="st ${x.cls}">${x.a}-${x.b}${

  // niente superficie nel testo: la dice già la barra colorata a sinistra
  const sub=[dateFull(m.date),timeRange(m),m.court?esc(m.court):''].filter(Boolean).join(' · ');
  return `<div class="mcard" data-act="detail" data-id="${m.id}">

      <div class="res ${resClass(o)}">${resLetter(o)}</div>

function vStats(){
  const list=sorted(), r=record(list);
  if(!list.length) return `<div class="empty">${ball()}<h3>Nessun dato</h3>
    <p>Registra la tua prima partita per vedere le statistiche.</p></div>`;

  const g=gamesRec(list), st=setsRec(list);
  const setPct=(st.a+st.b)?Math.round(st.a/(st.a+st.b)*100):0;
  const gamePct=(g.g+g.o)?Math.round(g.g/(g.g+g.o)*100):0;

  let h=`<section class="card">
    <div class="clabel big"><b>${r.tot}</b> partite giocate</div>
    <div class="rings">
      ${ring(r.pct,'Vittorie',`${r.w}V · ${r.d}P · ${r.l}S`)}
      ${ring(setPct,'Set',`${st.a}-${st.b}`)}
      ${ring(gamePct,'Game',`${g.g}-${g.o}`)}
    </div>
  </section>`;

  /* superfici — stesso schema della home */
  h+=surfaceBlend(list,'Rendimento per superficie');

  /* andamento — game fatti contro game subiti, ultime 20 */
  const lastN=list.slice(0,20);
  h+=`<section class="card">
    <div class="clabel">Andamento <em>· ultime ${lastN.length}</em></div>
    ${gamesChart(lastN)}
  </section>`;

  h+=recordsCard();
  h+=calendarCard();

  /* avversari frequenti → testa a testa */
  const byOpp={};
  list.forEach(m=>{const k=oppKey(m)||'—';(byOpp[k]=byOpp[k]||[]).push(m)});
  const tops=Object.entries(byOpp).sort((a,b)=>b[1].length-a[1].length).slice(0,10);
  if(tops.length){
    h+=`<section class="card"><div class="clabel">Avversari frequenti</div>`;
    tops.forEach(([o,ms])=>{const rr=record(ms);
      h+=`<div class="statline tap" data-act="opp" data-n="${esc(o)}">
        <div class="k" style="color:var(--txt);font-weight:800">${esc(oppFull(ms[0]))}<small>${ms.length} partite</small></div>
        <div class="v" style="color:${rr.w>rr.l?'var(--win)':rr.l>rr.w?'var(--loss)':'var(--draw)'}">${recStr(rr)}</div>
        <div class="go">›</div></div>`;});
    h+=`</section>`;
  }
  return h;
}

/* --- record personali --- */
function bestStreak(type){
  const chrono=sorted().slice().reverse();
  let best=0,bestFrom=null,bestTo=null,cur=0,curFrom=null;
  chrono.forEach(m=>{
    if(outcome(m)===type){
      if(cur===0)curFrom=m;
      cur++;
      if(cur>best){best=cur;bestFrom=curFrom;bestTo=m;}
    }else cur=0;
  });
  return {n:best,from:bestFrom,to:bestTo};
}
function widest(type){
  let best=null,bd=-1;
  sorted().forEach(m=>{
    if(outcome(m)!==type)return;
    let g=0,o=0;(m.sets||[]).forEach(s=>{if(s.kind==='tb')return;g+=+s.me||0;o+=+s.opp||0});
    const diff=type==='W'?g-o:o-g;
    if(diff>bd){bd=diff;best=m;}
  });
  return best;
}
function streakWhen(s){
  if(!s.n)return '';
  const a=monthLabel(s.from.date), b=monthLabel(s.to.date);
  return a===b?a:a+' → '+b;
}
function recordsCard(){
  const all=sorted();
  if(!all.length)return '';
  const sw=bestStreak('W'), sl=bestStreak('L');
  const bigW=widest('W'), bigL=widest('L');

  const byM={};all.forEach(m=>{const k=(m.date||'').slice(0,7);if(k)(byM[k]=byM[k]||[]).push(m)});
  let bm=null,bmw=-1;
  Object.entries(byM).forEach(([k,ms])=>{const r=record(ms);if(r.w>bmw){bmw=r.w;bm={k,r};}});

  const byO={};all.forEach(m=>{const k=oppKey(m);if(k)(byO[k]=byO[k]||[]).push(m)});
  let vo=null,vow=-1;
  Object.entries(byO).forEach(([k,ms])=>{const r=record(ms);if(r.w>vow){vow=r.w;vo={k,r,ms};}});

  const line=(k,sub,v,col)=>`<div class="statline"><div class="k">${k}${sub?`<small>${sub}</small>`:''}</div>
    <div class="v"${col?` style="color:${col}"`:''}>${v}</div></div>`;

  let h=`<section class="card"><div class="clabel">Record personali</div>`;
  h+=line('Striscia di vittorie',streakWhen(sw)||'Nessuna',sw.n||'–','var(--win)');
  h+=line('Striscia di sconfitte',streakWhen(sl)||'Nessuna',sl.n||'–','var(--loss)');
  if(bigW)h+=line('Vittoria più netta',esc(oppFull(bigW))+' · '+dateLabel(bigW.date),scoreStr(bigW),'var(--win)');
  if(bigL)h+=line('Sconfitta più netta',esc(oppFull(bigL))+' · '+dateLabel(bigL.date),scoreStr(bigL),'var(--loss)');
  if(bm)h+=line('Miglior mese',monthLabel(bm.k+'-01'),bm.r.w+'V-'+bm.r.l+'S');
  if(vo)h+=line('Avversario più battuto',esc(oppFull(vo.ms[0])),vo.r.w+'V-'+vo.r.l+'S');
  h+=`</section>`;
  return h;
}

function vHist(){

      ${SKEYS.map(k=>`<button class="chip ${SURF[k].cls} ${filt.surf.has(k)?'on':''}" data-act="fsurf" data-k="${k}">${SURF[k].n}</button>`).join('')}

      <button class="chip d ${filt.res.has('D')?'on':''}" data-act="fres" data-k="D">Pareggi</button>
      <button class="chip l ${filt.res.has('L')?'on':''}" data-act="fres" data-k="L">Sconfitte</button>
    </div>
  </div>`;

  let list=sorted().filter(m=>filt.surf.has(m.surface));
  list=list.filter(m=>{const o=outcome(m);return o?filt.res.has(o):false;});
  if(filt.q.trim())list=list.filter(m=>oppFull(m).toLowerCase().includes(filt.q.trim().toLowerCase()));

  if(!list.length)return h+`<div class="empty">${ball()}<h3>Nessuna partita</h3><p>Prova a cambiare i filtri.</p></div>`;

  let curMonth='';
  list.forEach(m=>{

  });
  return h;
}

/* =========================================================
   VISTA — DETTAGLIO MATCH
   ========================================================= */
function vDetail(id){
  const m=S.matches.find(x=>x.id===id);
  if(!m)return `<div class="empty"><h3>Match non trovato</h3></div>`;
  const s=SURF[m.surface]||SURF.hard,o=outcome(m);
  // il vincitore del match sta sempre nella riga in alto
  const flip=o==='L';
  const ds=dispSets(m);                    // .a = riga alta, .b = riga bassa
  const p=oppParts(m), me=S.profile;
  const meRow ={f:me.name||'',  l:me.surname||me.name||'Io'};
  const oppRow={f:p.first||'',  l:p.last||'Avversario'};
  const rowTop   = flip?oppRow:meRow;
  const rowBottom= flip?meRow:oppRow;

  let n=0;
  const heads=ds.map(x=>x.tbk?'ST':'SET '+(++n));
  // i punti del tie-break si mostrano in apice su chi ha perso quel set
  const tbLow=x=>{
    if(!x.tb)return null;
    const v=String(x.tb).split('-').map(t=>parseInt(t,10)).filter(t=>!isNaN(t));
    return v.length===2?Math.min(...v):null;
  };
  const cells=side=>ds.map(x=>{
    const mine=side==='a'?x.a:x.b, other=side==='a'?x.b:x.a;
    const won=mine>other, lo=tbLow(x);
    return `<b class="${won?'w':''}">${mine}${(!won&&lo!==null)?`<sup>${lo}</sup>`:''}</b>`;
  }).join('');
  const nameBlock=r=>`<div class="mh-nm"><div class="bar"></div><div class="t">
    ${r.f?`<div class="f">${esc(r.f)}</div>`:''}<div class="l">${esc(r.l)}</div></div></div>`;

  let h=`<section class="mhead s-${s.cls}">
    <div class="mh-inner">
      <div class="mh-meta">
        <span>${dateFull(m.date)}</span>${m.time?`<i></i><span>${timeRange(m)}</span>`:''}
      </div>
      <div class="mh-grid">
        <div class="mh-hd">
          <div class="club">${m.court?esc(m.court):''}</div>
          <div class="cols">${heads.map(t=>`<span>${t}</span>`).join('')}</div>
        </div>
        <div class="mh-row ${o==='D'?'':'win'}">
          ${nameBlock(rowTop)}<div class="mh-sc">${cells('a')}</div>
        </div>
        <div class="mh-row ${o==='D'?'':'lose'}">
          ${nameBlock(rowBottom)}<div class="mh-sc">${cells('b')}</div>
        </div>
      </div>
    </div>
  </section>`;

  h+=`<section class="card"><div class="clabel">Dettagli</div>`;
  if(m.court)h+=`<div class="statline"><div class="k">Campo</div><div class="v" style="font-size:14px">${esc(m.court)}</div></div>`;
  h+=`<div class="statline"><div class="k">Superficie</div><div class="v" style="font-size:14px">${s.n}</div></div>`;
  if(m.duration)h+=`<div class="statline"><div class="k">Durata</div><div class="v" style="font-size:14px">${durLabel(m.duration)}</div></div>`;
  if(oppKey(m))h+=`<div class="statline tap" data-act="opp" data-n="${esc(oppKey(m))}">
    <div class="k">Testa a testa<small>Storico contro ${esc(oppFull(m))}</small></div><div class="go">›</div></div>`;
  h+=`</section>`;

  if(m.notes){
    h+=`<div class="sec"><h2>Note</h2></div><div class="note">${esc(m.notes).replace(/\n/g,'<br>')}</div>`;
  }
  h+=`<div class="spacer"></div><div class="grid2" style="margin-top:18px">
    <button class="btn ghost sm" data-act="edit" data-id="${m.id}">Modifica</button>
    <button class="btn danger sm" data-act="del" data-id="${m.id}">Elimina</button>
  </div>`;
  return h;
}

  return Object.assign({
    id:null,date:d.toISOString().slice(0,10),time:'19:00',duration:60,result:null,
    opponent:'',oppFirst:'',surface:'hard',court:'',sets:[{me:'',opp:'',tb:''}],
    notes:''
  },pre||{});
}

function draftFrom(m){
  const o=outcome(m);

  // se la partita è vecchia, separo nome e cognome per il form
  const p=oppParts(m);
  d.oppFirst=p.first;d.opponent=p.last;
  d.sets=dispSets(m).map(s=>{
    const o={me:String(s.a),opp:String(s.b),tb:s.tb||''};

    return o;
  });
  return d;

  <section class="card">

  </section>
  <section class="card">
    <div class="clabel">Dati</div>
    <div style="font-size:11.5px;color:var(--txt-3);line-height:1.5;margin-bottom:12px">
      ${S.matches.length} partite salvate</div>
    ${demoCount()?`<button class="btn danger sm" data-act="rmdemo">Rimuovi ${demoCount()} partite di esempio</button>
      <div style="height:9px"></div>`:''}
    <button class="btn danger sm" data-act="wipe">Cancella tutti i dati</button>
  </section>
  <div style="text-align:center;color:var(--txt-3);font-size:10px;margin-top:22px;font-weight:800;text-transform:uppercase;letter-spacing:.1em">
    Game, Set &amp; Match! · ${cloudUser?'sincronizzato':'solo su questo dispositivo'}</div>`;
}

/* =========================================================
   RITAGLIO FOTO PROFILO
   ========================================================= */
const crop={img:null,base:1,scale:1,x:0,y:0,V:250,drag:null};
function openCropper(src){
  const img=new Image();
  img.onload=()=>{
    crop.img=img;crop.scale=1;
    crop.base=Math.max(crop.V/img.width,crop.V/img.height);
    const w=img.width*crop.base,h=img.height*crop.base;
    crop.x=(crop.V-w)/2;crop.y=(crop.V-h)/2;
    document.getElementById('cropimg').src=src;
    document.getElementById('cropzoom').value=100;
    document.getElementById('cropper').classList.remove('hidden');
    applyCrop();
  };
  img.onerror=()=>flash('Immagine non valida');
  img.src=src;
}
function applyCrop(){
  const el=document.getElementById('cropimg');
  if(!el||!crop.img)return;
  const eff=crop.base*crop.scale;
  const w=crop.img.width*eff,h=crop.img.height*eff,V=crop.V;
  crop.x=Math.min(0,Math.max(V-w,crop.x));
  crop.y=Math.min(0,Math.max(V-h,crop.y));
  el.style.width=w+'px';el.style.height=h+'px';
  el.style.transform=`translate(${crop.x}px,${crop.y}px)`;
}
function closeCropper(){
  document.getElementById('cropper').classList.add('hidden');
  crop.img=null;crop.drag=null;
  const f=document.getElementById('avfile');if(f)f.value='';
}
function saveCrop(){
  if(!crop.img)return;
  const eff=crop.base*crop.scale,V=crop.V,SZ=320;
  const c=document.createElement('canvas');c.width=c.height=SZ;
  const ctx=c.getContext('2d');
  ctx.drawImage(crop.img,-crop.x/eff,-crop.y/eff,V/eff,V/eff,0,0,SZ,SZ);
  S.profile.avatar=c.toDataURL('image/jpeg',.86);
  save();closeCropper();render();flash('Foto aggiornata');
}
(function initCropper(){
  const vw=document.getElementById('cropview');
  const zoom=document.getElementById('cropzoom');
  vw.addEventListener('pointerdown',e=>{
    if(!crop.img)return;
    crop.drag={px:e.clientX,py:e.clientY};
    vw.setPointerCapture(e.pointerId);
  });
  vw.addEventListener('pointermove',e=>{
    if(!crop.drag||!crop.img)return;
    crop.x+=e.clientX-crop.drag.px;
    crop.y+=e.clientY-crop.drag.py;
    crop.drag.px=e.clientX;crop.drag.py=e.clientY;
    applyCrop();
  });
  const end=e=>{crop.drag=null;try{vw.releasePointerCapture(e.pointerId)}catch(_){}};
  vw.addEventListener('pointerup',end);
  vw.addEventListener('pointercancel',end);
  zoom.addEventListener('input',()=>{
    if(!crop.img)return;
    const old=crop.scale;
    crop.scale=+zoom.value/100;
    const k=crop.scale/old, V=crop.V;
    crop.x=V/2-(V/2-crop.x)*k;
    crop.y=V/2-(V/2-crop.y)*k;
    applyCrop();
  });
})();

/* =========================================================
   EVENTI
   ========================================================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const A=t.dataset.act;
  switch(A){
    case 'go': go(t.dataset.v); break;
    case 'back': history.back(); break;
    case 'settheme': S.theme=t.dataset.k;save();render();break;
    case 'new': draft=newDraft();go('form');break;
    case 'detail': go('detail',t.dataset.id);break;
    case 'opp': go('opp',t.dataset.n);break;
    case 'mres':{
      const m=S.matches.find(x=>x.id===t.dataset.id);
      if(!m)break;
      const o=outcome(m);
      const box=document.getElementById('reveal');
      if(!box){
        flash(resName(o)+' · '+oppFull(m)+' · '+scoreStr(m));
        haptic();break;
      }
      // ritoccando la stessa partita il riquadro si richiude
      if(box.dataset.id===m.id&&!box.classList.contains('hidden')){
        box.classList.add('hidden');box.dataset.id='';haptic();break;
      }
      box.className='reveal '+resClass(o);
      box.dataset.id=m.id;
      box.innerHTML=`<span class="rtit">${o==='W'?'✓':o==='L'?'✕':'='} ${resName(o)}</span>${esc(oppFull(m))} · ${scoreStr(m)} · ${dateFull(m.date)}`;
      haptic();break;
    }
    case 'hmy': hmYear=+t.dataset.k;render();break;
    case 'setres': draft.result=t.dataset.k;haptic();render();break;
    case 'edit':{
      const m=S.matches.find(x=>x.id===t.dataset.id);
      if(m){draft=draftFrom(m);go('form');}
      break;
    }
    case 'del':{
      if(confirm('Eliminare questa partita?')){
        const id=t.dataset.id;
        S.matches=S.matches.filter(x=>x.id!==id);
        // la cancellazione va ricordata, altrimenti il cloud la rimetterebbe
        S.deleted=(S.deleted||[]).filter(d=>d.id!==id).concat([{id,at:Date.now()}]).slice(-200);
        save();flash('Partita eliminata');go('hist');}
      break;
    }
    case 'fsurf':{
      const k=t.dataset.k;
      filt.surf.has(k)?filt.surf.delete(k):filt.surf.add(k);
      render();break;
    }
    case 'fres':{
      const k=t.dataset.k;
      filt.res.has(k)?filt.res.delete(k):filt.res.add(k);
      render();break;
    }
    case 'surf': draft.surface=t.dataset.k;haptic();render();break;
    case 'stp':{
      const i=+t.dataset.i,s=t.dataset.s,d=+t.dataset.d;
      let v=draft.sets[i][s]===''?0:+draft.sets[i][s];
      v=Math.max(0,Math.min(30,v+d));
      draft.sets[i][s]=String(v);haptic();render();break;
    }
    case 'addset': draft.sets.push({me:'',opp:'',tb:''});render();break;
    case 'addtb': draft.sets.push({me:'',opp:'',tb:'',kind:'tb'});render();break;
    case 'rmset': draft.sets.splice(+t.dataset.i,1);render();break;
    case 'savematch': saveMatch();break;
    case 'rmdemo': removeDemo();break;
    case 'pickav': document.getElementById('avfile').click();break;
    case 'cropcancel': closeCropper();break;
    case 'cropsave': saveCrop();break;
    case 'login': cloudLogin();break;
    case 'logout':
      if(confirm('Disconnettere l\'account Google? I dati restano su questo dispositivo.'))cloudLogout();
      break;
    case 'wipe':
      if(confirm('Cancellare TUTTI i dati? Operazione irreversibile.')){
        S=blank();save();go('home');flash('Dati cancellati');}
      break;
    case 'q': break;
  }
});

/* input */
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.f&&draft){draft[el.dataset.f]=el.value;return;}
  if(el.dataset.sf&&draft){
    const i=+el.dataset.i,f=el.dataset.sf;
    let v=el.value;
    if(f!=='tb'){v=v.replace(/\D/g,'').slice(0,2);el.value=v;}
    draft.sets[i][f]=v;
    return;
  }
  if(el.dataset.p){S.profile[el.dataset.p]=el.value;save();return;}
  if(el.dataset.act==='q'){filt.q=el.value;renderHistList();return;}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='h2h'&&el.value){go('opp',el.value);return;}
  if(el.dataset.f&&draft)draft[el.dataset.f]=el.value;
  if(el.dataset.p){S.profile[el.dataset.p]=el.value;save();}
  // uscendo da un campo punteggio ridisegno: fa comparire/sparire il tie-break
  if(el.dataset.sf&&el.dataset.sf!=='tb'&&draft&&view.n==='form')render();
});

function renderHistList(){
  const el=document.getElementById('view');
  const pos=document.getElementById('q');const sel=pos?pos.selectionStart:null;
  el.innerHTML='<div>'+vHist()+'</div>';
  const q=document.getElementById('q');
  if(q){q.focus();if(sel!=null)try{q.setSelectionRange(sel,sel)}catch(e){}}
}

/* salvataggio partita */
function saveMatch(){
  const d=draft;
  if(!d.result){flash('Scegli prima l\'esito della partita');return;}
  const raw=d.sets.filter(s=>s.me!==''&&s.opp!=='').map(s=>{
    const o={me:+s.me,opp:+s.opp,tb:(s.tb||'').trim()};
    if(s.kind==='tb')o.kind='tb';
    return o;
  });
  if(!raw.length){flash('Inserisci almeno un set');return;}
  // in memoria i punti restano sempre "prima i miei": se ho perso, giro
  const sets=d.result==='L'
    ? raw.map(s=>{const o={me:s.opp,opp:s.me,tb:flipScore(s.tb)};if(s.kind)o.kind=s.kind;return o;})
    : raw;
  if(!d.opponent.trim()&&!(d.oppFirst||'').trim()){flash('Manca il nome dell\'avversario');return;}
  const m={
    id:d.id||uid(),date:d.date,time:d.time,duration:+d.duration||60,result:d.result,
    opponent:(d.opponent||'').trim(),oppFirst:(d.oppFirst||'').trim(),
    surface:d.surface,court:(d.court||'').trim(),
    sets,notes:(d.notes||'').trim(),
    updatedAt:Date.now(),     // serve a far vincere questa versione sul cloud
    fix:DATA_FIX              // una partita salvata da te è definitiva:
                              // le sistemazioni automatiche non devono più toccarla
  };
  if(d.id){S.matches=S.matches.map(x=>x.id===d.id?m:x);}else{S.matches.push(m);}
  save();draft=null;
  flash(m.result==='W'?'✓ Vittoria registrata':m.result==='D'?'= Pareggio registrato':'Sconfitta registrata');
  go('detail',m.id);
}
/* foto profilo → apre il ritaglio */
document.addEventListener('change',e=>{
  if(e.target.id==='avfile'&&e.target.files[0]){
    const r=new FileReader();
    r.onload=()=>openCropper(r.result);
    r.readAsDataURL(e.target.files[0]);
  }
});

/* =========================================================
   DATI DI ESEMPIO — tutto inventato a caso, profilo compreso
   ========================================================= */
const D_NOMI=['Luca','Simone','Federico','Alessio','Riccardo','Tommaso','Gabriele','Stefano',
  'Emanuele','Pietro','Lorenzo','Nicolò','Filippo','Edoardo','Samuele','Cristian'];
const D_COGN=['Bertolini','Marchetti','Fiorentino','Vitali','Ranieri','Sartori','Pagani','Zanetti',
  'Mancuso','Trevisan','Lombardi','Sacchetti','Belotti','Ravaglia','Nocera','Peluso','Grimaldi','Tosetto'];
const D_CITTA=['Chieri','Moncalieri','Collegno','Grugliasco','Pinerolo','Alpignano','Nichelino',
  'Orbassano','Carmagnola','Avigliana','Rivoli','Settimo Torinese'];
const D_CAMPI=['Tennis Club Aurora','Circolo La Pineta','Green Set Arena','Sporting Ronchi',
  'Tennis Bordo Po','Country Club Le Querce','Centro Sportivo Ibis'];
const D_LIV=['4.NC','4.6','4.5','4.4','4.3','4.2','3.5','3.4','NC'];
const D_NOTE=['Buona percentuale di prime, da migliorare la risposta sulla seconda.',
  'Servizio in tilt nel secondo set, poi rientrato col dritto.',
  'Troppi errori col rovescio lungolinea, meglio incrociare.',
  'Partita lunga e fisica, tenuta ottima nel finale.',
  'Sceso male a rete, da lavorare sulle volée basse.',
  '','','',''];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

/* Riconosce le partite rimaste dai dati di prova: hanno insieme un circolo e un
   cognome che esistono solo nei pool qui sopra, quindi non toccano quelle vere. */
function isDemoMatch(m){
  return D_CAMPI.indexOf((m.court||'').trim())>=0
      && D_COGN.indexOf(oppParts(m).last.trim())>=0;
}
function demoCount(){return (S.matches||[]).filter(isDemoMatch).length;}
function removeDemo(){
  const list=(S.matches||[]).filter(isDemoMatch);
  if(!list.length){flash('Nessuna partita di esempio trovata');return;}
  if(!confirm('Rimuovere '+list.length+' partite di esempio?\n\nLe tue partite vere non vengono toccate.'))return;
  S.matches=S.matches.filter(m=>!isDemoMatch(m));
  save();flash(list.length+' partite di esempio rimosse');go('home');
}

/* Non ha più pulsanti nell'app: si può richiamare solo dalla console.
   Prima era raggiungibile dalla schermata vuota, e bastava toccarlo mentre le
   partite vere non erano ancora arrivate dal cloud per sovrascrivere tutto. */
function loadDemo(){
  if((S.matches||[]).length &&
     !confirm('Attenzione: sostituisce le '+S.matches.length+' partite esistenti con dati inventati. Procedere?'))return;
  // avversari inventati, con nome e cognome separati
  const rivali=[];
  const usati=new Set();
  while(rivali.length<8){
    const c=pick(D_COGN);
    if(usati.has(c))continue;
    usati.add(c);
    rivali.push({first:pick(D_NOMI),last:c});
  }
  const campi=[];
  while(campi.length<3){const c=pick(D_CAMPI);if(!campi.includes(c))campi.push(c);}

  const out=[];const today=new Date();
  const n=rint(18,30);
  for(let i=0;i<n;i++){
    const d=new Date(today);d.setDate(d.getDate()-i*rint(6,12));
    const roll=Math.random();
    const sets=[];let result;
    if(roll<.08){
      const v=rint(6,8);
      sets.push({me:v,opp:v,tb:''});result='D';
    }else{
      const win=Math.random()<.55;result=win?'W':'L';
      const ns=Math.random()<.35?3:2;
      for(let k=0;k<ns;k++){
        const meWin=(k<2)?(k===0?win:(ns===3?!win:win)):win;
        const a=meWin?6:rint(0,4);
        const b=meWin?rint(0,4):6;
        const tie=Math.random()<.18;
        sets.push(tie?{me:meWin?7:6,opp:meWin?6:7,tb:meWin?'7-'+rint(2,5):rint(2,5)+'-7'}:{me:a,opp:b,tb:''});
      }
    }
    const riv=pick(rivali);
    out.push({id:uid(),date:d.toISOString().slice(0,10),
      time:pick(ORARI.slice(30,44)),duration:pick(DURATE),result,
      opponent:riv.last,oppFirst:riv.first,surface:Math.random()<.6?'clay':'hard',
      court:pick(campi),sets,notes:pick(D_NOTE)});
  }
  S.matches=out;
  if(!S.profile.name){
    S.profile=Object.assign(S.profile,{
      name:pick(D_NOMI), surname:pick(D_COGN),
      hand:Math.random()<.8?'Destro':'Mancino',
      age:String(rint(18,55)), height:String(rint(165,195)),
      city:pick(D_CITTA), level:pick(D_LIV), nat:pick(NAZ)[0]
    });
  }
  save();go('home');flash('Dati di esempio caricati');
}

/* navigazione / tasto indietro */
window.addEventListener('popstate',e=>{
  view=(e.state&&e.state.v)||{n:'home'};render();
});
go=function(n,p){
  view={n,p};
  history.pushState({v:view},'','');
  window.scrollTo(0,0);render();
};
history.replaceState({v:view},'','');

fixImported();fixNames();
render();
</script>
