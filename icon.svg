<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="court" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C4593A"/>
      <stop offset="36%" stop-color="#E0785A"/>
      <stop offset="64%" stop-color="#3A87DA"/>
      <stop offset="100%" stop-color="#1F5FA9"/>
    </linearGradient>
    <radialGradient id="ball" cx="36%" cy="30%" r="76%">
      <stop offset="0%" stop-color="#EEFF7C"/>
      <stop offset="70%" stop-color="#D9F52B"/>
      <stop offset="100%" stop-color="#A9C400"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#court)"/>

  <!-- campo visto dall'alto, proporzioni regolamentari:
       corridoi del doppio, linee di servizio a metà campo, riga centrale -->
  <g fill="none" stroke="#fff" stroke-width="12" opacity=".97">
    <!-- linee del doppio (rettangolo esterno) -->
    <rect x="128" y="68" width="256" height="375"/>
    <!-- linee del singolare -->
    <path d="M160 68v375M352 68v375"/>
    <!-- linee di servizio -->
    <path d="M160 154h192M160 358h192"/>
    <!-- riga centrale di servizio -->
    <path d="M256 154v204"/>
    <!-- segni di metà sulle linee di fondo -->
    <path d="M256 68v18M256 425v18"/>
  </g>

  <!-- rete, con i pali che sporgono oltre il campo -->
  <path d="M102 256h308" stroke="#fff" stroke-width="21" stroke-linecap="round"/>

  <!-- pallina al centro del campo -->
  <circle cx="256" cy="256" r="45" fill="url(#ball)"/>
  <g fill="none" stroke="#16250E" stroke-width="7" stroke-linecap="round" opacity=".78">
    <path d="M224 226c14 18 14 42 0 60"/>
    <path d="M288 226c-14 18-14 42 0 60"/>
  </g>
</svg>
